[project]
name = "iam-roles-anywhere-handson"
version = "0.1.0"
description = "30-minute IAM Roles Anywhere concept lab: private CA, CreateSession, CN trust, CRL revocation"
requires-python = ">=3.12"
dependencies = ["boto3>=1.43.89,<2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
