spring.application.name=capacity-lab

# The two bounds this lab is about. Tomcat threads cap concurrency inside one
# instance, the pool caps how many of those threads may touch the downstream.
server.tomcat.threads.max=200
server.tomcat.accept-count=100

lab.pool.size=10
lab.pool.timeout-ms=3000
lab.cache.hit-ratio=0.0
lab.cache.latency-ms=1
lab.downstream.url=http://127.0.0.1:9000/query
lab.downstream.timeout-ms=5000

lab.db.workers=4
lab.db.max-connections=60
lab.db.service-ms=20
