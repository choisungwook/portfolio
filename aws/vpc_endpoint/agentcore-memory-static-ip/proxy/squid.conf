# S02: client-side forward proxy. CONNECT tunnels only, to two AWS hostnames on 443.
# Name -> NLB EIP mapping is NOT here; it comes from this host's /etc/hosts (docker --add-host).
http_port 3128

acl aws_static dstdomain sts.ap-northeast-2.amazonaws.com bedrock-agentcore.ap-northeast-2.amazonaws.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT aws_static SSL_ports
http_access deny all

# No ssl_bump: TLS stays end to end between the app and AWS.
access_log /var/log/squid/access.log
cache deny all
