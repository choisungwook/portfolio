# Same image and container health check as the healthy task definition revision.
services:
  web:
    image: public.ecr.aws/nginx/nginx:stable-alpine
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 1
