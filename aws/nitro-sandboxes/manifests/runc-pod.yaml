apiVersion: v1
kind: Pod
metadata:
  name: runc-pod
  labels:
    app: nitro-sandbox-demo
    variant: runc-pod
spec:
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
