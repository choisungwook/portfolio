apiVersion: v1
kind: Pod
metadata:
  name: isolated-network-off-pod
  labels:
    app: nitro-sandbox-demo
    variant: isolated-network-off-pod
  annotations:
    sandbox.amazonaws.com/network-isolated: "true"
spec:
  runtimeClassName: isolated-sandbox
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
