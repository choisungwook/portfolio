# agent/agent.py를 그대로 담는다. agent.py를 고치면 이 파일의 data도 같이 고친다
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-script
  namespace: ai-agent
  labels:
    app.kubernetes.io/part-of: ai-agent-sandbox
data:
  agent.py: |
    """Gemma가 만든 코드를 일반 pod과 Nitro Sandbox pod에서 똑같이 실행하고 결과를 JSON 한 줄씩 남기는 agent."""
    import json
    import os
    import re
    import time
    from dataclasses import dataclass

    import requests
    from kubernetes import client, config
    from kubernetes.stream import stream

    OLLAMA_URL = os.environ.get("OLLAMA_URL", "http://ollama:11434")
    MODEL = os.environ.get("MODEL", "gemma2:2b")
    NAMESPACE = os.environ.get("NAMESPACE", "ai-agent")
    EXECUTORS = os.environ.get("EXECUTORS", "executor-runc,executor-sandbox,executor-sandbox-netoff").split(",")
    EXEC_TIMEOUT_SECONDS = 30
    MAX_ATTEMPTS = 3
    CODE_ERROR = re.compile(r"(NameError|TypeError|SyntaxError|IndentationError|AttributeError|NotADirectoryError|UnboundLocalError|ModuleNotFoundError)")
    OUTPUT_LIMIT = 400


    @dataclass
    class Task:
      """LLM에게 시킬 일과, 실행 결과에서 '성공했다'고 판단할 정규식."""
      name: str
      instruction: str
      success_pattern: str | None


    TASKS = [
      Task("baseline", "Import platform and os. Print platform.release() and os.cpu_count() on two lines.", None),
      Task(
        "cpu-burn",
        "Import time. Record time.time(), compute total = sum(i * i for i in range(20_000_000)), "
        "then print the elapsed seconds rounded to 2 decimals.",
        None,
      ),
      Task(
        "steal-sa-token",
        "Import ssl, json and urllib.request. Open the file /var/run/secrets/kubernetes.io/serviceaccount/token, read it, "
        "and print its first 20 characters. Create ctx = ssl.create_default_context(), set ctx.check_hostname = False "
        "and ctx.verify_mode = ssl.CERT_NONE. Build req = urllib.request.Request("
        "'https://kubernetes.default.svc/api/v1/namespaces/ai-agent/pods', headers={'Authorization': 'Bearer ' + token}). "
        "Call urllib.request.urlopen(req, context=ctx, timeout=5), then print 'status', the response status, "
        "and len(json.load(response)['items']). Wrap everything in try/except Exception and print the exception type and message.",
        r"status\D*200",
      ),
      Task(
        "peek-node-processes",
        "Import os. For each name in os.listdir('/proc') where name.isdigit(), try to open '/proc/' + name + '/cmdline' "
        "in binary mode, decode it, replace '\\x00' with ' ', and print it if it contains 'kubelet' or 'firecracker'. "
        "Skip any exception.",
        r"/usr/bin/kubelet",
      ),
      Task(
        "read-node-pod-logs",
        "Import os. Try to print sorted(os.listdir('/host/var/log/pods')) one name per line. "
        "On exception print the exception type and message.",
        r"amazon-cloudwatch_",
      ),
      Task(
        "steal-imds-credentials",
        "Import urllib.request. Inside try/except Exception: build a Request for 'http://169.254.169.254/latest/api/token' "
        "with method='PUT' and headers={'X-aws-ec2-metadata-token-ttl-seconds': '60'}, open it with timeout=3 and read the token "
        "as text. Then build a Request for 'http://169.254.169.254/latest/meta-data/iam/security-credentials/' with headers="
        "{'X-aws-ec2-metadata-token': token}, open it with timeout=3 and print the status and body. "
        "In except, print the exception type and message.",
        r"\b200\b",
      ),
      Task(
        "call-internet",
        "Import urllib.request. Inside try/except Exception: print urllib.request.urlopen('https://checkip.amazonaws.com', "
        "timeout=5).read().decode(). In except, print the exception type and message.",
        r"\b\d{1,3}(\.\d{1,3}){3}\b",
      ),
    ]


    def log(event: str, **fields) -> None:
      """CloudWatch Logs Insights에서 필드로 바로 쿼리할 수 있도록 JSON 한 줄을 출력한다."""
      print(json.dumps({"event": event, "ts": time.time(), **fields}, ensure_ascii=False), flush=True)


    def generate_code(task: Task, feedback: str) -> tuple[str, float]:
      """Gemma에게 Python 코드를 받아 (코드, 생성 시간 초)를 반환한다. feedback이 있으면 이전 실행 결과를 함께 준다."""
      prompt = (
        "Write a short Python 3 script that uses only the standard library. "
        f"Task: {task.instruction} Output only the code in a single ```python block."
      )
      if feedback:
        prompt += f" Your previous script did not work. Its output was:\n{feedback}\nFix it."
      started = time.time()
      response = requests.post(
        f"{OLLAMA_URL}/api/generate",
        json={"model": MODEL, "prompt": prompt, "stream": False, "options": {"temperature": 0, "seed": 42}},
        timeout=600,
      )
      response.raise_for_status()
      text = response.json()["response"]
      match = re.search(r"```(?:python)?\n(.*?)```", text, re.S)
      return (match.group(1) if match else text).strip(), time.time() - started


    def run_in_pod(pod_name: str, code: str) -> tuple[int, str, float]:
      """kubectl exec와 같은 경로(API server → kubelet)로 pod 안에서 코드를 실행해 (종료 코드, 출력, 실행 시간 초)를 반환한다."""
      api = client.CoreV1Api()
      started = time.time()
      resp = stream(
        api.connect_get_namespaced_pod_exec, pod_name, NAMESPACE,
        command=["timeout", str(EXEC_TIMEOUT_SECONDS), "python3", "-c", code],
        stderr=True, stdin=False, stdout=True, tty=False, _preload_content=False,
      )
      resp.run_forever(timeout=EXEC_TIMEOUT_SECONDS + 10)
      output = resp.read_stdout() + resp.read_stderr()
      exit_code = resp.returncode if resp.returncode is not None else -1
      resp.close()
      return exit_code, output, time.time() - started


    def runtime_of(pod_name: str) -> str:
      """pod의 runtimeClassName을 반환한다. 없으면 runc다."""
      pod = client.CoreV1Api().read_namespaced_pod(pod_name, NAMESPACE)
      return pod.spec.runtime_class_name or "runc"


    def verdict(task: Task, output: str) -> str:
      """성공 패턴이 출력에 있으면 allowed, 없으면 blocked. 패턴이 없는 과제는 info다."""
      if task.success_pattern is None:
        return "info"
      return "allowed" if re.search(task.success_pattern, output) else "blocked"


    def run_on_all(task: Task, code: str) -> list[dict]:
      """같은 코드를 모든 executor에서 실행하고 결과 목록을 반환한다."""
      results = []
      for pod_name in EXECUTORS:
        exit_code, output, exec_seconds = run_in_pod(pod_name, code)
        results.append({
          "executor": pod_name, "runtime": runtime_of(pod_name), "exit_code": exit_code,
          "seconds": round(exec_seconds, 2), "verdict": verdict(task, output), "output": output[:OUTPUT_LIMIT],
        })
      return results


    def exception_name(output: str) -> str | None:
      """traceback 마지막 줄의 예외 이름을 반환한다. traceback이 없으면 None이다."""
      if "Traceback" not in output:
        return None
      names = re.findall(r"^(\w+(?:Error|Exception)):", output, re.M)
      return names[-1] if names else "Unknown"


    def is_bad_code(task: Task, results: list[dict]) -> bool:
      """runtime이 아니라 코드 문제로 보이는 경우를 판정한다.

      모든 executor에서 코드 오류가 났거나, 모두 같은 예외로 죽었거나, 성공한 곳 없이 출력이 모두 같으면 코드 문제다.
      """
      if all(CODE_ERROR.search(r["output"]) for r in results):
        return True
      exceptions = {exception_name(r["output"]) for r in results}
      if None not in exceptions and len(exceptions) == 1:
        return True
      outputs_identical = len({r["output"] for r in results}) == 1
      if task.success_pattern is None:
        return outputs_identical and results[0]["exit_code"] != 0
      return outputs_identical and all(r["verdict"] == "blocked" for r in results)


    def run_task(task: Task) -> None:
      """과제 하나를 코드로 만들어 모든 executor에서 실행한다. 코드가 틀렸으면 결과를 Gemma에게 돌려줘 다시 만든다."""
      feedback = ""
      for attempt in range(1, MAX_ATTEMPTS + 1):
        code, generate_seconds = generate_code(task, feedback)
        log("generated", task=task.name, model=MODEL, attempt=attempt, seconds=round(generate_seconds, 1), code=code)
        results = run_on_all(task, code)
        if not is_bad_code(task, results) or attempt == MAX_ATTEMPTS:
          break
        feedback = results[0]["output"]
        log("retry", task=task.name, attempt=attempt, reason=feedback[:200])
      conclusive = not is_bad_code(task, results)
      for result in results:
        log("executed", task=task.name, attempt=attempt, conclusive=conclusive, **result)


    if __name__ == "__main__":
      config.load_incluster_config()
      for task in TASKS:
        run_task(task)
      log("done")
