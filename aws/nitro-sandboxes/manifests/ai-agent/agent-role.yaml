# agent는 executor pod의 runtime을 조회하고(get) 코드를 보낸다(pods/exec). 그 외의 권한은 없다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-executor-exec
  namespace: ai-agent
  labels:
    app.kubernetes.io/part-of: ai-agent-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["executor-runc", "executor-sandbox", "executor-sandbox-netoff"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["executor-runc", "executor-sandbox", "executor-sandbox-netoff"]
    verbs: ["create", "get"]
