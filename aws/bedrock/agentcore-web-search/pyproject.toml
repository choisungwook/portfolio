[project]
name = "agentcore-web-search-handson"
version = "0.1.0"
description = "Amazon Bedrock Web Search and AgentCore hands-on clients"
requires-python = ">=3.12"
dependencies = [
  "aws-bedrock-token-generator>=1.1.0",
  "boto3>=1.43.0",
  "botocore[crt]>=1.43.0",
  "openai>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_web_search"]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
