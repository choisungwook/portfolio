name: release-akbun-caculatorllm

on:
  pull_request:
    paths:
      - 'product/akbun-caculatorllm/**'
      - '.github/workflows/release-akbun-caculatorllm.yml'
  push:
    branches: [master]
    paths:
      - 'product/akbun-caculatorllm/**'
      - '.github/workflows/release-akbun-caculatorllm.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-caculatorllm/workspace

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-caculatorllm/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run calculation tests
        run: npm test

      - name: Build static assets
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-caculatorllm/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
