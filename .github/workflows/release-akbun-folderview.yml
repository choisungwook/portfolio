name: release-akbun-folderview

on:
  push:
    branches:
      - master
    # workflow 파일만 바뀐 경우는 빌드할 이유가 없으므로 트리거에서 뺀다.
    paths:
      - 'product/akbun-folderview/**'
  pull_request:
    # workflow 파일만 바뀐 경우는 빌드할 이유가 없으므로 트리거에서 뺀다.
    paths:
      - 'product/akbun-folderview/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-folderview/workspace

jobs:
  # PR 검증용. 앱 바이너리 없이 두 테스트 스위트만 확인한다.
  # 검색과 트리는 node로, 스캔과 rescan merge는 cargo로 돈다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run page tests
        run: npm test

      # library.rs 자체는 tauri를 쓰지 않지만 같은 crate에 있어서 cargo가
      # tauri까지 빌드한다. 그래서 순수 로직 테스트인데도 리눅스 시스템
      # 의존성이 필요하다. 대신 이 job이 Rust 컴파일 검증도 겸하게 된다.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
        working-directory: .

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-folderview/workspace/src-tauri

      - name: Run library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # Windows 전용 빌드. tauri-action이 NSIS 설치 파일과 서명, latest.json까지
  # 만들고 release를 생성한다. tag는 git tag가 아니라 release를 만들 때
  # GitHub이 함께 만든다.
  release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      # target 디렉터리를 캐시하지 않으면 매 릴리스마다 의존성을 다시 빌드한다.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-folderview/workspace/src-tauri

      - name: Install dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이터가 설치 전에 검증하는 서명이다. 이 두 값이 없으면
          # .sig 파일이 안 만들어지고, tauri-action은 latest.json 업로드를
          # 조용히 건너뛴다. release는 초록불인데 업데이트만 안 된다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: product/akbun-folderview/workspace
          tagName: akbun-folderview-v__VERSION__
          releaseName: akbun-folderview-v__VERSION__
          # draft로 두면 releases/latest/download/latest.json이 404가 되어
          # 아무도 업데이트를 못 받는다. 릴리스는 바로 공개한다.
          releaseDraft: false
          prerelease: false
          # NSIS만 빌드하지만 기본값이 msi 우선이라 명시한다.
          updaterJsonPreferNsis: true
          releaseBody: |
            직접 추가한 사진과 영상만 모아 태그, 등급, 검색으로 찾는 Windows 데스크톱 앱이다.

            - 설치 파일은 Windows x64 전용이다.
            - exe를 내려받아 실행하면 사용자 폴더에 설치되고 바로 실행된다. 관리자 권한은 필요 없다.
            - 코드 서명이 없어 SmartScreen 경고가 나온다. "추가 정보"를 누르고 "실행"을 선택하면 설치된다.
            - 설치 후에는 Settings의 Check for Updates로 다음 버전을 받는다.
