name: release-akbun-folderview

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-folderview/**'
  pull_request:
    paths:
      - 'product/akbun-folderview/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-folderview/workspace

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run page tests
        run: npm test

      # folderview-library depends on neither tauri nor a webview, so -p keeps
      # this to serde and walkdir. Testing the app crate instead would need GTK
      # and WebKit installed on the runner.
      - name: Run library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p folderview-library

  release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-folderview/workspace/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-folderview/workspace/src-tauri

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these no .sig is produced, and the action then skips
          # latest.json without failing. The release looks complete and no
          # installed copy can update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: product/akbun-folderview/workspace
          tagName: akbun-folderview-v__VERSION__
          releaseName: akbun-folderview-v__VERSION__
          # A draft is not reachable at releases/latest/download/latest.json,
          # so every installed copy would get a 404 on its update check.
          releaseDraft: false
          prerelease: false
          # Only NSIS is built, but latest.json prefers msi by default.
          updaterJsonPreferNsis: true
          releaseBody: |
            ## About

            - Windows desktop app that collects only the photos and videos you add, and finds them again by tag, rating and search.

            ## Install

            - The installer is Windows x64 only.
            - Downloading and running the exe installs into the user folder and launches at once. No administrator rights needed.
            - Unsigned build, so SmartScreen warns. Choose "More info" then "Run anyway".
            - After installing, Check for Updates in Settings fetches newer versions.

      # tauri-action has no --generate-notes equivalent, so the commit list is
      # generated and appended to the body the action already wrote.
      - name: Append the change list to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "akbun-folderview-v$version"
          gh release view $tag --json body --jq .body --repo ${{ github.repository }} > notes.md
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$tag --jq .body >> notes.md
          gh release edit $tag --notes-file notes.md --repo ${{ github.repository }}

      # releases/latest is repository-wide, so any other product's release
      # steals it and installed copies silently see the wrong latest.json.
      # The updater endpoint points at this fixed tag instead, and this step
      # is the only thing that moves it.
      - name: Publish updater manifest to the fixed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release download "akbun-folderview-v$version" --pattern latest.json --output latest.json --repo ${{ github.repository }}
          gh release view akbun-folderview-updater --repo ${{ github.repository }} || gh release create akbun-folderview-updater --latest=false --title akbun-folderview-updater --notes "akbun-folderview updater manifest. Do not delete." --repo ${{ github.repository }}
          gh release upload akbun-folderview-updater latest.json --clobber --repo ${{ github.repository }}
