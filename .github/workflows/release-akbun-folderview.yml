name: release-akbun-folderview

on:
  push:
    branches:
      - master
    # workflow 파일만 바뀐 경우는 빌드할 이유가 없으므로 트리거에서 뺀다.
    paths:
      - 'product/akbun-folderview/**'
  pull_request:
    # workflow 파일만 바뀐 경우는 빌드할 이유가 없으므로 트리거에서 뺀다.
    paths:
      - 'product/akbun-folderview/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-folderview/workspace

jobs:
  # PR 검증용. electron 바이너리 없이 테스트만 확인한다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 저장소 규칙상 lock 파일을 커밋하지 않으므로 npm ci 대신 npm install을 쓴다.
      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # 업데이트 기능이 임시 파일을 남기지 않는지 확인한다. 교체 스크립트는
      # batch 파일이라 ubuntu에서 실행되지 않고 skip되며, release job이
      # windows에서 같은 테스트를 다시 돌려 그 부분까지 확인한다.
      - name: Run tests
        run: npm test

  # Windows 전용 빌드. NSIS 설치 파일 빌드가 성공해야 tag를 만들고,
  # tag가 만들어져야 release를 만든다. 버전은 package.json의 version을 그대로
  # 쓰므로 workspace를 고치면 버전도 함께 올린다.
  release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=akbun-folderview-v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Install dependencies
        run: npm install

      # windows runner이므로 교체 스크립트 테스트까지 실제로 실행된다.
      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run dist

      # 빌드가 성공한 뒤에만 tag를 만든다.
      - name: Create tag
        working-directory: .
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      # tag 생성이 성공한 뒤에만 release를 만든다.
      - name: Create release with installer
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          - 직접 추가한 사진과 영상만 모아 태그, 등급, 검색으로 찾는 Windows 데스크톱 앱이다.
          - 설치 파일은 Windows x64 전용이다.
          - exe를 내려받아 실행하면 사용자 폴더에 설치되고 바로 실행된다. 관리자 권한은 필요 없다.
          - 코드 서명이 없어 SmartScreen 경고가 나온다. "추가 정보"를 누르고 "실행"을 선택하면 설치된다.
          - 설치 후에는 Help > Check for Updates로 다음 버전을 받는다.
          EOF
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            product/akbun-folderview/workspace/release/*.exe
