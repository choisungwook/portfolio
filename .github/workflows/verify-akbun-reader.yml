name: verify-akbun-reader

# Deployment is a Cloudflare Workers Build on push to master, so there is
# nothing to release here. This job proves the Worker still type-checks,
# bundles, and passes its DOM-free tests.
on:
  pull_request:
    paths:
      - 'product/akbun-reader/**'
      - '.github/workflows/verify-akbun-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-reader/workspace

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-reader/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      # worker/lib is pure, so this needs no Cloudflare account and no D1.
      - name: Run tests
        run: npm test

      # tsc plus a wrangler dry run: bundles the Worker without deploying.
      - name: Type-check and bundle
        run: npm run check

  cli:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: product/akbun-reader/workspace/cli
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Test CLI
        run: cargo +stable test --locked
      - name: Lint CLI
        run: cargo +stable clippy --locked --all-targets -- -D warnings
