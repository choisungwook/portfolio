name: akbun-gitdesktop release

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-gitdesktop/**'

permissions:
  contents: write

defaults:
  run:
    working-directory: product/akbun-gitdesktop

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: echo "tag=gitdesktop-v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create release if missing and decide build
        id: check
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if assets=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); then
            # 릴리스는 있지만 dmg가 없으면 빌드를 다시 수행한다.
            if echo "$assets" | grep -q '\.dmg$'; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already has installers. Skip build."
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:mac

      - name: Upload installers to release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            product/akbun-gitdesktop/release/*.dmg \
            --clobber
