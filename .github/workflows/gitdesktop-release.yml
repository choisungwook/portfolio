name: akbun-gitdesktop release

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-gitdesktop/**'

permissions:
  contents: write

defaults:
  run:
    working-directory: product/akbun-gitdesktop

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: echo "tag=gitdesktop-v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release if missing and decide build
        id: check
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$(gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.dmg$' || true)" ]; then
            # 릴리스는 있지만 빌드 산출물이 없으면 빌드를 다시 수행한다.
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already has installers. Skip build."
          fi

  build:
    needs: tag
    if: needs.tag.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 저장소 정책상 lock 파일을 커밋하지 않으므로 npm ci 대신 npm install을 쓴다.
      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npm run dist:mac

      - name: Upload installers to release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            product/akbun-gitdesktop/release/*.dmg \
            --clobber
