name: akbun-gitdesktop release

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-gitdesktop/**'
  pull_request:
    paths:
      - 'product/akbun-gitdesktop/**'
      - '.github/workflows/gitdesktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-gitdesktop

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-gitdesktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run page tests
        run: npm test

      - name: Run Rust model tests
        run: npm run test:rust

  release:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: '--bundles appimage'
            targets: ''
          - platform: windows-latest
            args: '--bundles nsis'
            targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-gitdesktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-gitdesktop/src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_GITDESKTOP }}
        with:
          projectPath: product/akbun-gitdesktop
          tagName: gitdesktop-v__VERSION__
          releaseName: gitdesktop-v__VERSION__
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          releaseBody: |
            ## About

            - Git graph, branch, worktree, GitHub pull request, issue and project desktop viewer.

            ## Install

            - macOS: download the dmg. The build is ad-hoc signed and not notarized.
            - Windows: download the exe. No administrator rights needed. If SmartScreen warns, choose More info then Run anyway.
            - Linux: download the AppImage and make it executable.
            - Check for Updates in the app fetches newer signed versions.

  publish-updater-manifest:
    if: github.event_name != 'pull_request'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Publish updater manifest to the fixed tag
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./product/akbun-gitdesktop/package.json').version")
          gh release download "gitdesktop-v$version" --pattern latest.json --output latest.json --repo ${{ github.repository }}
          gh release view akbun-gitdesktop-updater --repo ${{ github.repository }} || gh release create akbun-gitdesktop-updater --latest=false --title akbun-gitdesktop-updater --notes "akbun-gitdesktop updater manifest. Do not delete." --repo ${{ github.repository }}
          gh release upload akbun-gitdesktop-updater latest.json --clobber --repo ${{ github.repository }}
