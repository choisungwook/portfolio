name: akbun-gitdesktop release

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-gitdesktop/**'
  pull_request:
    paths:
      - 'product/akbun-gitdesktop/**'

permissions:
  contents: write

defaults:
  run:
    working-directory: product/akbun-gitdesktop

jobs:
  # PR 검증용. electron 바이너리 없이 typecheck와 테스트만 돌린다.
  # 업데이트 기능이 임시 파일을 남기지 않는지 확인하는 테스트가 여기서 돈다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/akbun-gitdesktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'gitdesktop-v*' | sed 's/^gitdesktop-v//' | sort -V | tail -n1)
          package=$(node -p "require('./package.json').version")
          if [ -z "$latest" ]; then
            next="$package"
          else
            # 마지막 릴리스의 patch를 +1 해서 기존 릴리스를 덮어쓰지 않는다.
            IFS=. read -r major minor patch <<< "$latest"
            bumped="$major.$minor.$((patch + 1))"
            # package.json을 직접 올려 major/minor를 바꿨다면 그 값을 따른다.
            next=$(printf '%s\n%s\n' "$bumped" "$package" | sort -V | tail -n1)
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=gitdesktop-v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing gitdesktop-v$next (previous tag: ${latest:-none})"

      - name: Fail if the tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Refusing to overwrite a published release."
            exit 1
          fi

      - name: Apply version to package.json
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:mac

      - name: Create tag
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release with installers
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            product/akbun-gitdesktop/release/*.dmg
