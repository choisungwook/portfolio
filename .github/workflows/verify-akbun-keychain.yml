name: verify-akbun-keychain

# Guards what an akbun-keychain change must not miss:
# - verify: the type check, every test, and the [critical] tests that guard the
#   security model, with a minimum count so a renamed or deleted one fails.
# - platforms: the tests and a compiled binary on macOS, Linux and Windows,
#   because the vault, lock file and agent differ by OS.
# release-akbun-keychain.yml (plan phase 7) will build and release the binary.
on:
  pull_request:
    paths:
      - 'product/akbun-keychain/**'
      - '.github/workflows/verify-akbun-keychain.yml'
  push:
    branches:
      - master
    paths:
      - 'product/akbun-keychain/workspace/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-keychain/workspace

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Current Node LTS. It runs the TypeScript sources directly by type stripping.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: product/akbun-keychain/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Fails when a critical test fails or fewer than test/critical-minimum.json ran.
      - name: Run critical tests
        run: npm run test:critical

      - name: Run all tests
        run: npm test

  platforms:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: product/akbun-keychain/workspace
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: product/akbun-keychain/workspace/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm test

      # The release ships a bun-compiled binary, so a change that breaks the
      # compile or the binary's startup on one OS must fail here, not at release.
      - name: Build and run the binary
        run: |
          node scripts/build-binary.ts
          expected="akbun-keychain $(node -p "require('./package.json').version")"
          actual="$(./dist/akbun-keychain version)"
          echo "$actual"
          test "$actual" = "$expected"
