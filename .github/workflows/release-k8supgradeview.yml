name: release-k8supgradeview

on:
  push:
    branches:
      - master
    # workflow 파일만 바뀐 경우는 빌드할 이유가 없으므로 트리거에서 뺀다.
    paths:
      - 'product/akbun-k8supgradeview/workspace/**'
  pull_request:
    paths:
      - 'product/akbun-k8supgradeview/workspace/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-k8supgradeview/workspace

jobs:
  # PR 검증용. electron 바이너리 없이 tsc 컴파일만 확인한다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-k8supgradeview/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # 업데이트 기능이 임시 파일을 남기지 않는지 확인한다. build가 함께 돈다.
      # 교체 스크립트 테스트는 hdiutil이 없는 ubuntu에서도 동작한다.
      - name: Compile TypeScript and run tests
        run: npm test

  # macOS arm64 전용 빌드. dmg 빌드가 성공해야 tag를 만들고, tag가 만들어져야 release를 만든다.
  # 버전은 workspace/package.json의 version을 그대로 쓴다.
  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-k8supgradeview/workspace/package-lock.json

      - name: Read version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=akbun-k8supgradeview-v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Install dependencies
        run: npm ci

      - name: Build dmg
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 빌드가 성공한 뒤에만 tag를 만든다.
      - name: Create tag
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      # tag 생성이 성공한 뒤에만 release를 만든다.
      - name: Create release with dmg
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## About

          - Desktop app that lists nodes and pods for EKS upgrade work, macOS build.

          ## Install

          - The dmg is Apple Silicon (arm64) only.
          - Unsigned build, so the first launch fails with "damaged and can't be opened".
          - Fix by removing the quarantine attribute after installing: `xattr -cr /Applications/akbun-k8supgradeview.app`
          EOF
          # --generate-notes appends the "What's Changed" commit list under the notes file.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            product/akbun-k8supgradeview/workspace/release/*.dmg
