name: release-akbun-taskq

# Builds a single taskq executable per platform with bun. It embeds the UI, the schema and the Claude Code binary of
# the locked SDK, so it runs without Node or a checkout. The macOS job also wraps that executable in a desktop app
# (workspace/desktop) and releases it as a dmg. Pull requests build and smoke test; master releases.
on:
  pull_request:
    paths:
      - 'product/akbun-taskq/workspace/**'
      - '.github/workflows/release-akbun-taskq.yml'
      - '.github/scripts/taskq-changelog.mjs'
  push:
    branches:
      - master
    paths:
      - 'product/akbun-taskq/workspace/src/**'
      - 'product/akbun-taskq/workspace/ui/**'
      - 'product/akbun-taskq/workspace/package.json'
      - 'product/akbun-taskq/workspace/package-lock.json'
      - 'product/akbun-taskq/workspace/scripts/build-binary.ts'
      - 'product/akbun-taskq/workspace/desktop/**'
      - '.github/workflows/release-akbun-taskq.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-taskq/workspace

jobs:
  # The Claude Code binary comes from the platform package npm installs, so each target builds on its own OS.
  # A pull request builds Linux only: it proves the bundle compiles, and a macOS runner can queue for many minutes.
  # master builds both targets for the release.
  build:
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"runner":"ubuntu-latest","target":"linux-x64"}]' || '[{"runner":"macos-latest","target":"darwin-arm64"},{"runner":"ubuntu-latest","target":"linux-x64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-taskq/workspace/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: npm ci

      - name: Build binary
        run: node scripts/build-binary.ts dist/taskq

      # Without Node on PATH: version extracts and runs the embedded Claude Code, opening the database runs the
      # embedded schema, and list reads it back.
      - name: Smoke test
        run: |
          home=$(mktemp -d)
          env -i HOME="$home" PATH=/usr/bin:/bin dist/taskq version | grep -q 'Claude Code'
          env -i HOME="$home" TASKQ_HOME="$home" TASKQ_NO_NOTIFY=1 PATH=/usr/bin:/bin dist/taskq add --type research --intent smoke
          env -i HOME="$home" TASKQ_HOME="$home" TASKQ_NO_NOTIFY=1 PATH=/usr/bin:/bin dist/taskq list | grep -q smoke

      - name: Package
        if: github.event_name != 'pull_request'
        run: tar -czf "taskq-${{ matrix.target }}.tar.gz" -C dist taskq

      # The desktop app is a window around the executable built above: tauri bundles it next to the app's own binary.
      # macOS only, so it never runs on a pull request. Unsigned, like the executable.
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name != 'pull_request' && matrix.target == 'darwin-arm64'

      - uses: swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' && matrix.target == 'darwin-arm64'
        with:
          workspaces: product/akbun-taskq/workspace/desktop/src-tauri

      - name: Build desktop app
        if: github.event_name != 'pull_request' && matrix.target == 'darwin-arm64'
        working-directory: product/akbun-taskq/workspace/desktop
        run: |
          mkdir -p src-tauri/binaries
          cp ../dist/taskq src-tauri/binaries/taskq-aarch64-apple-darwin
          npm ci
          npx tauri build --bundles dmg
          cp src-tauri/target/release/bundle/dmg/*.dmg ../taskq-desktop-darwin-arm64.dmg

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: taskq-${{ matrix.target }}
          path: |
            product/akbun-taskq/workspace/taskq-${{ matrix.target }}.tar.gz
            product/akbun-taskq/workspace/taskq-desktop-${{ matrix.target }}.dmg
          retention-days: 1

  # Every platform must build before the tag exists, and the tag must exist before the release.
  # The version is package.json's; merging the same version again fails on the existing tag.
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Read version from package.json
        id: version
        run: |
          version=$(node -p "require('./product/akbun-taskq/workspace/package.json').version")
          echo "tag=akbun-taskq-v$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf "## What's Changed\n\n" > release-notes.md
          node --input-type=module -e '
            import { releaseNotes } from "./.github/scripts/taskq-changelog.mjs"
            console.log(releaseNotes())
          ' >> release-notes.md
          cat >> release-notes.md <<EOF

          ## Install

          - \`taskq-desktop-darwin-arm64.dmg\` is the macOS app for Apple silicon: taskq in its own window. Copy it to Applications and run \`xattr -cr /Applications/akbun-taskq.app\` once; the build is unsigned.
          - \`taskq-darwin-arm64.tar.gz\` for Apple silicon, \`taskq-linux-x64.tar.gz\` for Linux x86_64 are the command line executable.
          - Extract and put \`taskq\` on PATH. On macOS, run \`xattr -d com.apple.quarantine taskq\` once after a browser download.
          - See the [taskq manual](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/$TAG/product/akbun-taskq/workspace/manual.md) for configuration.
          EOF

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md dist/*.tar.gz dist/*.dmg
