name: verify-pull-request

# 모든 PR에 도는 공통 검사. product별 테스트는 verify-<product>.yml이 맡고,
# 이 workflow는 바뀐 파일의 lint, 저장소 규칙 검사, PR body 형식을 본다.
# 규칙 검사는 .github/scripts/checks/에 있고 로컬에서도 같은 명령으로 돈다.
# 새로 추가한 파일의 lint 실패는 PR을 막고, 고친 기존 파일의 실패는 경고로만
# 남긴다. 이 저장소의 오래된 문서와 yaml은 lint를 거치지 않고 쌓였기 때문이다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  MARKDOWNLINT_CLI_VERSION: 0.49.1
  ACTIONLINT_VERSION: 1.7.12
  PYYAML_VERSION: 6.0.3
  RUFF_VERSION: 0.17.5
  BIOME_VERSION: 2.6.7

jobs:
  lint-changed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 추가된 파일과 고친 파일을 나눠 둔다. 아래 단계들이 추가는 실패, 수정은 경고로 다룬다.
      - name: List changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" > added.txt
          git diff --name-only --diff-filter=MR "$BASE_SHA...$HEAD_SHA" > modified.txt
          echo "added:"; cat added.txt
          echo "modified:"; cat modified.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 파일 목록은 xargs -r로 넘긴다. 목록이 비면 아무것도 실행하지 않는다.
      - name: markdownlint
        run: |
          grep -E '\.md$' added.txt \
            | xargs -r npx --yes "markdownlint-cli@$MARKDOWNLINT_CLI_VERSION" --config .markdownlint.json
          grep -E '\.md$' modified.txt \
            | xargs -r npx --yes "markdownlint-cli@$MARKDOWNLINT_CLI_VERSION" --config .markdownlint.json \
            || echo "::warning::고친 Markdown 파일에 기존 lint 오류가 있음. PR을 막지는 않음"

      - uses: hashicorp/setup-terraform@v4

      - name: terraform fmt
        run: |
          grep -E '\.tf$' added.txt | xargs -r terraform fmt -check -diff
          grep -E '\.tf$' modified.txt | xargs -r terraform fmt -check -diff \
            || echo "::warning::고친 Terraform 파일에 기존 fmt 차이가 있음. PR을 막지는 않음"

      # workflow는 모든 PR에 돌므로 추가든 수정이든 실패로 막는다.
      - name: actionlint
        run: |
          grep -hE '^\.github/workflows/.*\.ya?ml$' added.txt modified.txt \
            | xargs -r docker run --rm -v "$PWD:/repo" -w /repo "rhysd/actionlint:$ACTIONLINT_VERSION" -color

  # 리뷰어의 판단에 맡기던 규칙을 스크립트로 검사한다. 앞 검사가 실패해도 나머지를
  # 끝까지 돌려 한 번에 다 알려 준다.
  repo-checks:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CHECKS: .github/scripts/checks
    steps:
      # 버전 검사가 기존 tag를 조회하므로 전체 history와 tag를 받는다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List changed files
        run: |
          git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" > added.txt
          git diff --name-only --diff-filter=MR "$BASE_SHA...$HEAD_SHA" > modified.txt

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install check dependencies
        run: pip install "pyyaml==$PYYAML_VERSION" "ruff==$RUFF_VERSION"

      - name: product version bump
        if: ${{ !cancelled() }}
        run: python3 "$CHECKS/check_product_versions.py" --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: product index
        if: ${{ !cancelled() }}
        run: python3 "$CHECKS/check_product_index.py"

      - name: workflow names
        if: ${{ !cancelled() }}
        run: python3 "$CHECKS/check_workflow_names.py"

      # 규칙 파일은 이후 모든 세션이 읽으므로 바뀌지 않았어도 전부 본다.
      - name: rule file links
        if: ${{ !cancelled() }}
        run: |
          git ls-files AGENTS.md CLAUDE.md '.claude/*.md' '.github/*.md' 'templates/*.md' \
            | xargs -r python3 "$CHECKS/check_markdown_links.py"

      - name: markdown links
        if: ${{ !cancelled() }}
        run: |
          grep -E '\.md$' added.txt | xargs -r python3 "$CHECKS/check_markdown_links.py"
          grep -E '\.md$' modified.txt | xargs -r python3 "$CHECKS/check_markdown_links.py" --warn

      - name: knowledge concepts
        if: ${{ !cancelled() }}
        run: |
          grep -E '\.md$' added.txt | xargs -r python3 "$CHECKS/check_knowledge.py"
          grep -E '\.md$' modified.txt | xargs -r python3 "$CHECKS/check_knowledge.py" --warn

      - name: terraform rules
        if: ${{ !cancelled() }}
        run: |
          grep -E '\.tf$' added.txt | xargs -r python3 "$CHECKS/check_terraform.py"
          grep -E '\.tf$' modified.txt | xargs -r python3 "$CHECKS/check_terraform.py" --warn

      - name: kubernetes manifests
        if: ${{ !cancelled() }}
        run: |
          grep -E '\.ya?ml$' added.txt | xargs -r python3 "$CHECKS/check_manifests.py"
          grep -E '\.ya?ml$' modified.txt | xargs -r python3 "$CHECKS/check_manifests.py" --warn

      # 하위 디렉터리의 pyproject.toml이 설정을 덮지 않도록 루트 ruff.toml을 지정한다.
      - name: python (ruff)
        if: ${{ !cancelled() }}
        run: |
          grep -E '\.py$' added.txt | xargs -r ruff check --config ruff.toml
          grep -E '\.py$' added.txt | xargs -r ruff format --check --config ruff.toml
          grep -E '\.py$' modified.txt | xargs -r ruff check --config ruff.toml \
            || echo "::warning::고친 Python 파일에 기존 ruff 오류가 있음. PR을 막지는 않음"

      # 대상과 규칙은 루트 biome.json에 있다. error만 실패시키고 warning은 출력만 한다.
      - name: product lint (biome)
        if: ${{ !cancelled() }}
        run: |
          pattern='^product/.*\.(js|mjs|cjs|jsx|ts|mts|tsx)$'
          grep -E "$pattern" added.txt \
            | xargs -r npx --yes "@biomejs/biome@$BIOME_VERSION" lint --no-errors-on-unmatched
          grep -E "$pattern" modified.txt \
            | xargs -r npx --yes "@biomejs/biome@$BIOME_VERSION" lint --no-errors-on-unmatched \
            || echo "::warning::고친 product 파일에 기존 biome 오류가 있음. PR을 막지는 않음"

  pr-body:
    runs-on: ubuntu-latest
    steps:
      # body는 외부 입력이라 환경 변수로만 받고 스크립트에 직접 넣지 않는다.
      - name: Check PR body follows the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 웹 UI에서 쓴 body는 줄 끝이 CRLF라 먼저 CR을 지운다.
          body=$(printf '%s\n' "$PR_BODY" | tr -d '\r')
          fail=0
          for header in '# 작업 목적' '# 방식' '# 검증' '# 리스크'; do
            if ! printf '%s\n' "$body" | grep -qx "$header"; then
              echo "::error::PR body에 '$header' 절이 없음. .github/pull_request_template.md를 따를 것"
              fail=1
            fi
          done
          if ! printf '%s\n' "$body" | grep -qE '^Issue #[0-9]+'; then
            echo "::error::PR body 끝에 'Issue #<번호>' 링크가 없음"
            fail=1
          fi
          # 사람이 읽는 절은 작업 목적 하나이고 2줄 이내다. 템플릿 주석은 내용으로 세지 않는다.
          if ! printf '%s\n' "$body" | awk '/<!--/{c=1} c{if(/-->/)c=0; next} /^# 작업 목적$/{on=1; next} /^# /{on=0} on && NF{n++} END{exit !(n>=1 && n<=2)}'; then
            echo "::error::작업 목적 절은 1~2줄이어야 함. 목적 한 줄, 필요하면 사람 확인 한 줄"
            fail=1
          fi
          # 검증 절은 표다. 헤더와 구분선 아래 행이 하나도 없으면 증거가 없는 것이다.
          if ! printf '%s\n' "$body" | awk '/^# 검증$/{on=1; next} /^# /{on=0} on && /^\|/{n++} END{exit !(n>=3)}'; then
            echo "::error::검증 절에 표 행이 없음. 완료 조건, 실행, 결과 열로 행을 적을 것"
            fail=1
          fi
          # 코드블록은 줄 수에서 뺀다.
          lines=$(printf '%s\n' "$body" | awk '/^```/{fence=!fence; next} !fence && NF{n++} END{print n+0}')
          if [ "$lines" -gt 30 ]; then
            echo "::warning::PR body가 ${lines}줄로 30줄을 넘음. 리스크의 근거부터 줄일 것"
          fi
          exit $fail
