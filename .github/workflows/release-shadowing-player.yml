name: release-shadowing-player

on:
  push:
    branches:
      - master
    paths:
      - 'product/shadowing-player/**'
      - '.github/workflows/release-shadowing-player.yml'
  pull_request:
    paths:
      - 'product/shadowing-player/**'
      - '.github/workflows/release-shadowing-player.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/shadowing-player

jobs:
  # PR 검증용. electron 바이너리 없이 tsc 컴파일만 확인한다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 저장소 규칙상 lock 파일을 커밋하지 않으므로 npm ci 대신 npm install을 쓴다.
      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Compile TypeScript
        run: npm run build

  # package.json 버전으로 tag와 release를 만든다. tag가 이미 있으면 뒤 job을 건너뛴다.
  tag:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: echo "tag=shadowing-player-v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create tag and release if missing
        id: create
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists. Skip release."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          언어 공부(쉐도잉)용 구간 반복 오디오 플레이어 macOS 빌드. dmg(arm64, x64) 포함.

          코드 서명이 없어 처음 실행하면 "damaged and can't be opened" 오류가 난다. 앱 설치 후 아래 명령으로 quarantine 속성을 지우면 실행된다.

          ```bash
          xattr -cr /Applications/shadowing-player.app
          ```
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

  # macOS 전용 빌드. dmg를 release에 업로드한다.
  build:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build dmg
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload dmg to release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            product/shadowing-player/release/*.dmg \
            --clobber
