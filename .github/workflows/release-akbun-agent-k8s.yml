name: release-akbun-agent-k8s

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-agent-k8s/**'
  pull_request:
    paths:
      - 'product/akbun-agent-k8s/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-agent-k8s/workspace

jobs:
  # PR verification only; master merges run the release job instead.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9

      - name: Install dependencies
        run: uv sync

      # Tests run with a fake backend: no login, no network, no agent binary.
      - name: Run tests
        run: uv run pytest

  # No build artifact: the release is the tag, and users install from it with
  # uv tool install git+...@<tag>. The tag is created only after tests pass,
  # and the job fails early when the version was not bumped.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=akbun-agent-k8s-v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # Same-version merges mean someone forgot the bump; fail here, loudly,
      # instead of at the tag push after tests already burned minutes.
      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::tag $TAG already exists - bump the version in workspace/pyproject.toml"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Create tag
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<EOF
          - CLI agent that learns cross-service relationships from MSA source code and debugs with them.
          - Install: uv tool install "git+https://github.com/${{ github.repository }}.git@$TAG#subdirectory=product/akbun-agent-k8s/workspace"
          - Requires one backend: ANTHROPIC_API_KEY for claude, or a logged-in codex CLI for codex.
          EOF
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md
