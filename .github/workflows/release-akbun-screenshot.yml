name: release-akbun-screenshot

on:
  push:
    branches:
      - master
    # workflow 파일만 바뀐 경우는 빌드할 이유가 없으므로 트리거에서 뺀다.
    paths:
      - 'product/akbun-screenshot/workspace/**'
  pull_request:
    paths:
      - 'product/akbun-screenshot/workspace/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-screenshot/workspace

jobs:
  # PR 검증용. 순수 함수 테스트만 돌리므로 electron 바이너리가 필요 없다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-screenshot/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

  # macOS arm64 전용 빌드. dmg 빌드가 성공해야 tag를 만들고, tag가 만들어져야 release를 만든다.
  # 버전은 workspace/package.json의 version을 그대로 쓴다.
  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-screenshot/workspace/package-lock.json

      - name: Read version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=akbun-screenshot-v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build dmg
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 빌드가 성공한 뒤에만 tag를 만든다.
      - name: Create tag
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      # tag 생성이 성공한 뒤에만 release를 만든다.
      - name: Create release with dmg
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          macOS menu bar screenshot app. Area capture by drag, clipboard copy, floating preview with save or delete.

          The dmg is Apple Silicon (arm64) only and unsigned, so the first launch fails with "damaged and can't be opened". Remove the quarantine attribute after installing:

          ```bash
          xattr -cr /Applications/akbun-screenshot.app
          ```
          EOF
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            product/akbun-screenshot/workspace/release/*.dmg
