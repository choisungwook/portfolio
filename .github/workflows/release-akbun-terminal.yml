name: release-akbun-terminal

on:
  push:
    branches:
      - master
    # Nothing to build when only the workflow file changed.
    paths:
      - 'product/akbun-terminal/workspace/**'
  pull_request:
    paths:
      - 'product/akbun-terminal/workspace/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-terminal/workspace

jobs:
  # The core carries no AppKit, so its tests run on the cheap runner. This is the
  # payoff of keeping the model in its own crates: the pty round trip, the
  # protocol and the session lifetime are all checked here in seconds.
  core:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terminal/workspace/core

      - name: Run core tests
        run: cargo test --manifest-path core/Cargo.toml

  # The shell needs macOS, because the package links AppKit. This job is also the
  # only place the two languages are linked together, which is the step most
  # likely to break.
  shell:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terminal/workspace/core

      - name: Build the core static library
        run: ./scripts/build-core.sh

      - name: Run shell tests
        run: swift test

  # macOS arm64 only. The build has to succeed before the tag is created, and the
  # tag before the release. Version comes from workspace/VERSION.
  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terminal/workspace/core

      - name: Read version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=akbun-terminal-v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Run core tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Run shell tests
        run: |
          ./scripts/build-core.sh
          swift test

      - name: Build dmg
        run: ./scripts/bundle.sh

      # Only tag once the build succeeded.
      - name: Create tag
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      # Only release once the tag exists.
      - name: Create release with dmg
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## About

          - A macOS window that wraps a shell. The model, the sessions and the protocol live in a Rust core; the window is a thin AppKit shell over it.
          - Projects and workspaces on the left, terminal tabs in the middle, the project's files on the right.
          - The terminal is SwiftTerm, so colour, the cursor and full screen programs draw properly.
          - Markdown files open under the terminal, rendered or as source, and save back. A mermaid fence is drawn as a diagram, and an HTML file has a Render mode beside View and Edit.
          - Command F finds text in the file on screen; Command O opens any file in the project by typing part of its path.
          - Colour schemes known by name are under Settings, dark and light; the default follows the system appearance.
          - Settings also puts any menu command on any keystroke.
          - Each workspace is coloured by what the agent in it is doing, and a notification says when one finishes.
          - Which phrases mean what is one JSON file per agent under the app data directory, so a new agent is a new file.
          - Clicking a URL in the terminal offers to copy it or open it, in the system browser or one you name.
          - Command plus and minus zoom the terminal; the side panes drag to any width.
          - "Check for Updates…" in the application menu replaces the installed bundle in place.

          ## Install

          - The dmg is Apple Silicon (arm64) only.
          - Unsigned build, so the first launch fails with "damaged and can't be opened".
          - Fix by removing the quarantine attribute after installing: `xattr -cr /Applications/akbun-terminal.app`
          EOF
          # --generate-notes appends the "What's Changed" commit list under the notes file.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            product/akbun-terminal/workspace/build/*.dmg
