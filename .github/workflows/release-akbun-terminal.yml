name: release-akbun-terminal

on:
  push:
    branches:
      - master
    # Nothing to build when only the workflow file changed.
    paths:
      - 'product/akbun-terminal/workspace/**'
  pull_request:
    paths:
      - 'product/akbun-terminal/workspace/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-terminal/workspace

jobs:
  # The core and the tui carry no AppKit, so their tests run on the cheap runner:
  # the pty round trip, the protocol, the daemon and the tui's state are all
  # checked here in seconds.
  core:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terminal/workspace

      - name: Run core and tui tests
        run: cargo test --workspace

  # The desktop app needs macOS, because the package links AppKit. This job is
  # also the only place the Swift client talks to the real daemon, which is the
  # step most likely to break.
  desktop:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terminal/workspace

      - name: Build the core daemon
        run: ./desktop/scripts/build-core.sh

      - name: Run desktop tests
        working-directory: product/akbun-terminal/workspace/desktop
        run: swift test

  # macOS arm64 only. The build has to succeed before the tag is created, and the
  # tag before the release. Version comes from workspace/VERSION.
  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terminal/workspace

      - name: Read version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=akbun-terminal-v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Run core and tui tests
        run: cargo test --workspace

      - name: Run desktop tests
        run: |
          ./desktop/scripts/build-core.sh
          cd desktop && swift test

      - name: Build dmg and cli archive
        run: ./desktop/scripts/bundle.sh

      # Only tag once the build succeeded.
      - name: Create tag
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      # Only release once the tag exists.
      - name: Create release with dmg
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## About

          - A terminal workspace in three parts. A Rust core daemon owns the shells, the project tree and the agent status; a macOS app and a terminal UI are clients of it.
          - Shells live in the core, so they keep running when a client closes and the terminal UI can attach to them again.
          - Projects and workspaces on the left, terminal tabs in the middle, the project's files on the right.
          - The terminal is SwiftTerm, so colour, the cursor and full screen programs draw properly.
          - Markdown files open under the terminal, rendered or as source, and save back. A mermaid fence is drawn as a diagram, and an HTML file has a Render mode beside View and Edit.
          - Command F finds text in the file on screen; Command O opens any file in the project by typing part of its path.
          - Colour schemes known by name are under Settings, dark and light; the default follows the system appearance.
          - Settings also puts any menu command on any keystroke.
          - Each workspace is coloured by what the agent in it is doing, and a notification says when one finishes.
          - Which phrases mean what is one JSON file per agent under the app data directory, so a new agent is a new file.
          - Clicking a URL in the terminal offers to copy it or open it, in the system browser or one you name.
          - Command plus and minus zoom the terminal; the side panes drag to any width.
          - "Check for Updates…" in the application menu replaces the installed bundle in place.

          ## Install

          - The dmg is Apple Silicon (arm64) only. It carries the core beside the app.
          - `akbun-terminal-cli-*.tar.gz` holds `akbun-terminal-core` and `akbun-terminal-tui` for macOS arm64. Put both in one folder on `PATH` and run `akbun-terminal-tui`. On Linux, build them from source with `cargo build --release`.
          - Unsigned build, so the first launch fails with "damaged and can't be opened".
          - Fix by removing the quarantine attribute after installing: `xattr -cr /Applications/akbun-terminal.app`
          EOF
          # Only PRs that touched this product; --generate-notes lists the whole monorepo.
          bash "$GITHUB_WORKSPACE/.github/scripts/release-notes.sh" "$TAG" product/akbun-terminal >> release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            product/akbun-terminal/workspace/desktop/build/*.dmg \
            product/akbun-terminal/workspace/desktop/build/*.tar.gz
