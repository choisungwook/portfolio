name: release-tistory-skin

on:
  push:
    branches:
      - master
    paths:
      - 'product/tistory-skin/akbun/src/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read skin version
        id: version
        run: |
          cd product/tistory-skin/akbun/src
          VERSION=$(python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("index.xml").getroot()
          version = root.findtext("./information/version")
          if not version or not version.strip():
            sys.exit("index.xml version not found")
          print(version.strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=tistory-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        run: |
          cd product/tistory-skin/akbun/src
          files="skin.html style.css index.xml"
          [ -d images ] && files="$files images"
          zip -r ../akbun-skin.zip $files

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd product/tistory-skin/akbun
          cat > release-notes.md <<'EOF'
          ## About

          - Tistory blog skin, distributed as a zip artifact.

          ## Install

          - The zip contains skin.html, style.css, index.xml and the images directory.
          - Upload it from the Tistory skin editor. No build step needed.
          EOF
          # --generate-notes appends the "What's Changed" commit list under the notes file.
          gh release create "${{ steps.version.outputs.tag }}" akbun-skin.zip \
            --target "${{ github.sha }}" \
            --title "tistory-${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --generate-notes
