name: release-akbun-terraform-apply-remote

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-terraform-apply-remote/**'
  pull_request:
    paths:
      - 'product/akbun-terraform-apply-remote/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-terraform-apply-remote

jobs:
  # PR 검증용. master merge 시에는 release job만 실행한다.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ubuntu 러너에 rustup stable이 기본 설치되어 있어 별도 toolchain 설치가 필요 없다.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terraform-apply-remote

      # 저장소 규칙상 lock 파일을 커밋하지 않으므로 --locked 없이 빌드한다.
      - name: Build with warnings as errors
        run: cargo build
        env:
          RUSTFLAGS: -D warnings

      - name: Run tests
        run: cargo test

  # linux x86_64 바이너리를 빌드해 release로 올린다. 빌드가 성공해야 tag를 만들고,
  # tag가 만들어져야 release를 만든다. 버전은 Cargo.toml의 version을 그대로 쓴다.
  # 같은 버전으로 다시 merge하면 tag 충돌로 실패하므로 코드를 고치면 버전을 올린다.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-terraform-apply-remote

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=akbun-terraform-apply-remote-v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build release binary
        run: cargo build --release

      # 빌드가 성공한 뒤에만 tag를 만든다.
      - name: Create tag
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      # tag 생성이 성공한 뒤에만 release를 만든다.
      - name: Create release with binary
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## About

          - Self-hosted server that runs terraform plan and apply from GitHub pull request comments.

          ## Install

          - The binary is linux x86_64 only. Other architectures build from source.
          - Running it needs the terraform CLI and a GitHub webhook. See docs/user-guide.md.
          EOF
          # --generate-notes appends the "What's Changed" commit list under the notes file.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            product/akbun-terraform-apply-remote/target/release/akbun-terraform-apply-remote
