name: release-akbun-makephoto

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-makephoto/**'
  pull_request:
    paths:
      - 'product/akbun-makephoto/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-makephoto/workspace

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run page tests
        run: npm test

      # The core and the CLI depend on neither tauri nor a webview, so -p keeps
      # this to the image crate. Testing the app crate instead would need GTK
      # and WebKit installed on the runner. The HEIC decode test only runs on
      # macOS, where the system image engine exists.
      - name: Run core and CLI tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makephoto-core -p makephoto-cli

  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-makephoto/workspace/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-makephoto/workspace/src-tauri

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these no .sig is produced, and the action then skips
          # latest.json without failing. The release looks complete and no
          # installed copy can update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_MAKEPHOTO }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_MAKEPHOTO_PASSWORD }}
        with:
          projectPath: product/akbun-makephoto/workspace
          tagName: akbun-makephoto-v__VERSION__
          releaseName: akbun-makephoto-v__VERSION__
          # A draft is not reachable by the updater endpoint, so every
          # installed copy would 404 on its update check.
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## About

            - Photo catalog and editor for beginners: folders, tags, ratings, straighten, crop, light, color, film looks and one-click auto fixes.
            - Photos are referenced where they are and never changed. Edits are applied on export.
            - The app binary is also a command line tool (`makephoto`) for scripts and AI agents.

            ## Install

            - The installer is a macOS (Apple Silicon) dmg.
            - Unsigned build, so after dragging the app to Applications run once in Terminal: `xattr -cr /Applications/akbun-makephoto.app`
            - After that, Settings → Check for Updates fetches newer versions on its own.

      # tauri-action has no --generate-notes equivalent, so the commit list is
      # generated and appended to the body the action already wrote.
      - name: Append the change list to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="akbun-makephoto-v${VERSION}"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          bash "$GITHUB_WORKSPACE/.github/scripts/release-notes.sh" "$TAG" product/akbun-makephoto >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      # Several products release from this repository, so the GitHub-wide
      # "latest" release is whichever product shipped last. The app therefore
      # polls a fixed tag that only this step touches, instead of
      # releases/latest.
      - name: Publish updater manifest to the fixed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release download "akbun-makephoto-v${VERSION}" --pattern latest.json --dir "$RUNNER_TEMP"
          gh release create akbun-makephoto-updater \
            --title "akbun-makephoto updater manifest" \
            --notes "Fixed tag the installed app polls for updates. Do not delete." \
            --latest=false || true
          gh release upload akbun-makephoto-updater "$RUNNER_TEMP/latest.json" --clobber
