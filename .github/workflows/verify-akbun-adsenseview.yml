name: verify-akbun-adsenseview

# Verify only. The app is local-only and never released; see
# product/akbun-adsenseview/adr/2026-09-local-only-no-release.md.

on:
  pull_request:
    paths:
      - 'product/akbun-adsenseview/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-adsenseview/workspace

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-adsenseview/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check the page
        run: npm run check

      - name: Build the page
        run: npm run build

      # adsense-cache depends on neither tauri nor a webview, so -p keeps this
      # to chrono, serde and bundled SQLite. Testing the app crate would need
      # GTK and WebKit installed on the runner.
      - name: Run cache tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p adsense-cache
