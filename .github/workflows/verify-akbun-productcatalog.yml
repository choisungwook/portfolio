name: verify-akbun-productcatalog

# Deployment is a Cloudflare Pages build on push to master, so there is nothing
# to release here. This job only proves the page still tests and builds.
on:
  pull_request:
    paths:
      - 'product/akbun-productcatalog/**'
      # The catalog itself lives above this product, and the last test parses
      # it, so an edit to the data has to run this job too.
      - 'product/products.json'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-productcatalog/workspace

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-productcatalog/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      # src/lib is DOM free, and the last test parses product/products.json,
      # so a typo in the data file fails here too.
      - name: Run tests
        run: npm test

      - name: Build the page
        run: npm run build
