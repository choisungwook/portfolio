name: verify-akbun-taskq

# This job proves the code still type checks and passes its tests.
# release-akbun-taskq.yml builds and releases the binary.
on:
  pull_request:
    paths:
      - 'product/akbun-taskq/**'
      - '.github/workflows/verify-akbun-taskq.yml'
      - '.github/workflows/release-akbun-taskq.yml'
      - '.github/scripts/taskq-changelog.mjs'
  push:
    branches:
      - master
    paths:
      - 'product/akbun-taskq/workspace/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-taskq/workspace

jobs:
  # Type check, changelog and docs coverage run next to the tests instead of before them.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24 runs the TypeScript sources directly and bundles node:sqlite.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-taskq/workspace/package-lock.json

      - name: Check committed changelog
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module -e '
            import { checkChangelog } from "./.github/scripts/taskq-changelog.mjs"
            checkChangelog(process.cwd(), process.env.BASE, "HEAD")
          '

      - name: Install dependencies
        run: npm ci

      # Nothing is emitted; the build is the type check.
      - name: Build
        run: npm run build

      # Docs an agent relies on must cover the code: every API route, every Agent SDK option and every bot tool, plus a
      # changelog entry with an SDK section for the version being built, and every route reachable from the CLI and MCP.
      - name: Check docs and operations cover routes, SDK options and the changelog
        run: node --test test/docs-coverage.test.ts test/ops-coverage.test.ts
        env:
          TASKQ_NO_NOTIFY: '1'

  # The test files are split into two shards that run as parallel jobs; inside a job node --test runs files in parallel.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-taskq/workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pull requests run only the tests marked [critical]: the invariants whose
      # failure is an incident (approval, gating, auth, masking, claim, paths).
      # Worker, SDK and notifier are fakes, so no credentials and no model call.
      - name: Run critical tests
        if: github.event_name == 'pull_request'
        run: node --test --test-shard=${{ matrix.shard }}/2 --test-name-pattern="\[critical\]" "test/**/*.test.ts"
        env:
          TASKQ_NO_NOTIFY: '1'

      - name: Run all tests
        if: github.event_name != 'pull_request'
        run: node --test --test-shard=${{ matrix.shard }}/2 "test/**/*.test.ts"
        env:
          TASKQ_NO_NOTIFY: '1'
