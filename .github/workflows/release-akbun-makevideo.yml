name: release-akbun-makevideo

on:
  push:
    branches:
      - master
    paths:
      - 'product/akbun-makevideo/**'
  pull_request:
    paths:
      - 'product/akbun-makevideo/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: product/akbun-makevideo/workspace

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run page tests
        run: npm test

      # The time model everything else measures with. It depends on serde and
      # nothing else, so this is seconds.
      - name: Run time model tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-time

      # The editing model: every command, the invariants, and undo. This is
      # where the timeline actually lives, so it is the suite that has to stay
      # cheap to run. It depends on serde and the time crate and nothing else.
      - name: Run edit model tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-edit

      # makevideo-render depends on neither tauri nor a webview, so -p keeps
      # this to serde. Testing the app crate instead would need GTK and WebKit
      # installed on the runner. ffmpeg is not needed either: the crate builds
      # the argument list and runs nothing.
      - name: Run render model tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-render

      # The compositor has a software backend that needs nothing, so this runs
      # the whole pipeline on a machine with no graphics stack at all. It is
      # also what proves wgpu is genuinely optional rather than optional on
      # paper: --no-default-features must not pull it in.
      #
      # ffmpeg is also what the audio steps below decode with.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # The audio engine with no sound card and no cpal at all. That covers the
      # mix, the clock and the lock free ring, which is the part that has to be
      # right, and it proves the device half is genuinely optional. The mix is
      # also compared against the render's own amix here, which needs the ffmpeg
      # installed above but no output to play it on.
      - name: Run audio engine tests without an output device
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-audio --no-default-features

      # And again with cpal compiled in. It is not opened — a runner has nothing
      # to open — so what this checks is that the device sink still builds and
      # that its resampler takes exactly the frames it uses. ALSA headers are
      # what cpal needs to compile on Linux, and needing them is the reason the
      # feature exists.
      - name: Install the ALSA headers cpal builds against
        run: sudo apt-get install -y -qq libasound2-dev

      - name: Run audio engine tests with the device sink compiled in
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-audio

      - name: Run compositor tests without a GPU
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-compositor --no-default-features

      # The playback scheduler with no swapchain compiled in at all. Everything
      # that decides *when* a frame is shown is in here and none of it needs a
      # window, which is the whole reason it is a crate of its own — the same
      # split the compositor and the audio engine already make. Run before the
      # graphics driver is installed, so this really is the path with no wgpu in
      # its dependency tree.
      - name: Run playback scheduler tests without a surface
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-present --no-default-features

      # And again with wgpu, against lavapipe: a software Vulkan device, so the
      # GPU half is exercised on a runner with no hardware. That is what makes
      # "both backends draw the same frame" meaningful here.
      - name: Install a software GPU
        run: sudo apt-get install -y -qq mesa-vulkan-drivers

      - name: Run compositor tests with the GPU backend
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-compositor

      # And the scheduler again with the surface half compiled in, so the
      # swapchain format choice and the offscreen sink that draws through the
      # same call the swapchain uses are both exercised against lavapipe.
      - name: Run playback scheduler tests with the surface
        run: cargo test --manifest-path src-tauri/Cargo.toml -p makevideo-present

  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/akbun-makevideo/workspace/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/akbun-makevideo/workspace/src-tauri

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these no .sig is produced, and the action then skips
          # latest.json without failing. The release looks complete and no
          # installed copy can update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_MAKEVIDEO }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_MAKEVIDEO_PASSWORD }}
        with:
          projectPath: product/akbun-makevideo/workspace
          tagName: akbun-makevideo-v__VERSION__
          releaseName: akbun-makevideo-v__VERSION__
          # A draft is not reachable by the updater endpoint, so every
          # installed copy would 404 on its update check.
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## About

            - Desktop video editor: multi track timeline, live preview, render to FHD and 4K.

            ## Install

            - The installer is a macOS (Apple Silicon) dmg.
            - Rendering needs ffmpeg on the machine: `brew install ffmpeg`.
            - Unsigned build, so after dragging the app to Applications run once in Terminal: `xattr -cr /Applications/akbun-makevideo.app`
            - After that, Settings → Check for Updates fetches newer versions on its own.

      # tauri-action has no --generate-notes equivalent, so the commit list is
      # generated and appended to the body the action already wrote.
      - name: Append the change list to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="akbun-makevideo-v${VERSION}"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      # Several products release from this repository, so the GitHub-wide
      # "latest" release is whichever product shipped last. The app therefore
      # polls a fixed tag that only this step touches, instead of
      # releases/latest.
      - name: Publish updater manifest to the fixed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release download "akbun-makevideo-v${VERSION}" --pattern latest.json --dir "$RUNNER_TEMP"
          gh release create akbun-makevideo-updater \
            --title "akbun-makevideo updater manifest" \
            --notes "Fixed tag the installed app polls for updates. Do not delete." \
            --latest=false || true
          gh release upload akbun-makevideo-updater "$RUNNER_TEMP/latest.json" --clobber
