apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm
  namespace: llm
  labels:
    app.kubernetes.io/name: kgateway-quickstart
    app.kubernetes.io/component: llm
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames:
    - llm.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: vllm
          port: 8000
