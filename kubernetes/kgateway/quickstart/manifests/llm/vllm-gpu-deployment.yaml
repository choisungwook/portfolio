apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gpu
  namespace: llm
  labels:
    app: vllm
    app.kubernetes.io/name: kgateway-quickstart
    app.kubernetes.io/component: llm
spec:
  # GPU가 1장이므로 replica도 1이다. GPU는 파드끼리 나눠 쓸 수 없다
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.18.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - Qwen/Qwen2.5-0.5B-Instruct
            - --port
            - "8000"
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.6"
          ports:
            - name: http
              containerPort: 8000
          # 모델 로딩이 끝나야 /health가 200이므로 startupProbe로 기다린다
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
