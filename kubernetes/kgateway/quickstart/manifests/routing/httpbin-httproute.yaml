apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: httpbin
  labels:
    app.kubernetes.io/name: kgateway-quickstart
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames:
    - httpbin.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbin
          port: 8000
