apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-split
  namespace: httpbin
  labels:
    app.kubernetes.io/name: kgateway-quickstart
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames:
    - split.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbin
          port: 8000
          weight: 80
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                set:
                  - name: x-version
                    value: v1
        - name: httpbin-v2
          port: 8000
          weight: 20
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                set:
                  - name: x-version
                    value: v2
