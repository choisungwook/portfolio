apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-v2
  namespace: httpbin
  labels:
    app: httpbin-v2
    app.kubernetes.io/name: kgateway-quickstart
    app.kubernetes.io/component: routing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin-v2
  template:
    metadata:
      labels:
        app: httpbin-v2
    spec:
      containers:
        - name: httpbin
          image: docker.io/mccutchen/go-httpbin:v2.6.0
          imagePullPolicy: IfNotPresent
          command: [go-httpbin]
          args:
            - "-port"
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
