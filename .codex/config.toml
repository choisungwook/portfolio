default_permissions = "portfolio"

[permissions.portfolio]
description = "Portfolio project permissions."
extends = ":workspace"

[permissions.portfolio.filesystem.":workspace_roots"]
".git" = "write"
"**/*.avif" = "deny"
"**/*.AVIF" = "deny"
"**/*.bmp" = "deny"
"**/*.BMP" = "deny"
"**/*.gif" = "deny"
"**/*.GIF" = "deny"
"**/*.ico" = "deny"
"**/*.ICO" = "deny"
"**/*.jpeg" = "deny"
"**/*.JPEG" = "deny"
"**/*.jpg" = "deny"
"**/*.JPG" = "deny"
"**/*.png" = "deny"
"**/*.PNG" = "deny"
"**/*.svg" = "deny"
"**/*.SVG" = "deny"
"**/*.tif" = "deny"
"**/*.TIF" = "deny"
"**/*.tiff" = "deny"
"**/*.TIFF" = "deny"
"**/*.webp" = "deny"
"**/*.WEBP" = "deny"

[permissions.portfolio.network]
enabled = true
