[project]
name = "akbun-wiki"
version = "0.1.0"
description = "Mirror akbun-reader into a graphify wiki and serve it over an authenticated API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "uvicorn>=0.52.4",
]

[project.scripts]
wiki = "akbun_wiki.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "akbun_wiki"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
