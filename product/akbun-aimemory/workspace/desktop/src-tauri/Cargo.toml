[workspace]
members = ["crates/launch"]

[package]
name = "akbun-aimemory-desktop"
version = "0.1.0"
description = "The macOS desktop window around the aimem binary"
authors = ["akbun"]
license = "MIT"
edition = "2021"

# The version that ships is workspace/package.json's, which tauri.conf.json points at. cargo requires the one above.

[lib]
name = "akbun_aimemory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aimemory-launch = { path = "crates/launch" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
