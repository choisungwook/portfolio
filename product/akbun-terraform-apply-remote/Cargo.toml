[package]
name = "akbun-terraform-apply-remote"
version = "0.1.0"
edition = "2021"
description = "Atlantis-style terraform plan/apply automation driven by GitHub pull request comments"
license = "MIT"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
signal-hook = "0.3"
jsonwebtoken = "10"

[profile.release]
strip = true
