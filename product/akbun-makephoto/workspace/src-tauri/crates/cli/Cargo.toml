[package]
name = "makephoto-cli"
version = "0.1.0"
description = "Command line interface to the akbun-makephoto catalog"
edition = "2021"
license = "MIT"

[[bin]]
name = "makephoto"
path = "src/main.rs"

[dependencies]
makephoto-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
image = "0.25"
