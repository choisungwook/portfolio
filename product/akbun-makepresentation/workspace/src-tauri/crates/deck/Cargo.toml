[package]
name = "makepresentation-deck"
version = "0.1.0"
description = "The slide deck model: shapes, pptx read/write, pdf assembly"
edition = "2021"
license = "MIT"

# Deliberately depends on neither tauri nor anything that needs a webview.
# That is what lets the pull request job test this on Linux in seconds without
# installing GTK and WebKit development packages.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pptx is a zip of XML parts. Writing is string templates; reading needs a
# real XML pull parser because other editors nest the same parts differently.
zip = { version = "5", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
# Pictures travel to the page as data URLs, so both directions need base64.
base64 = "0.22"
