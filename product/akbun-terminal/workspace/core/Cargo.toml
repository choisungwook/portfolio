[workspace]
members = ["crates/core", "crates/ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
# Not the product version. The one that ships lives in workspace/VERSION.
version = "0.0.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
# The escape sequence tokenizer only. The screen it feeds is ours, because the
# core needs what is on screen, not a second renderer.
vte = { version = "0.15.0", default-features = false }
