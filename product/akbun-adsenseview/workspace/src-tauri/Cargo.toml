[workspace]
members = ["crates/cache"]

[package]
name = "akbun-adsenseview"
version = "0.1.0"
description = "Local-only macOS desktop viewer for Google AdSense earnings"
authors = ["akbun"]
license = "MIT"
edition = "2021"

# The version that ships is the one in ../package.json, which tauri.conf.json
# points at. The number here is not read by the bundler and is only present
# because cargo requires it.

[lib]
name = "akbun_adsenseview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adsense-cache = { path = "crates/cache" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13", features = ["json", "query", "form"] }
url = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
