[workspace]
members = ["crates/core"]

[package]
name = "akbun-awsviewer"
version = "0.1.0"
description = "macOS desktop viewer for AWS resources, read-only"
authors = ["akbun"]
license = "MIT"
edition = "2021"

# The version that ships is the one in ../package.json, which tauri.conf.json
# points at. The number here is not read by the bundler and is only present
# because cargo requires it.

[lib]
# The _lib suffix keeps the library name from colliding with the binary name,
# which is only a problem on Windows. See rust-lang/cargo#8519.
name = "akbun_awsviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything that talks to AWS lives in its own crate so the pull request job
# can test it without compiling tauri, which would mean installing GTK and
# WebKit on the runner.
awsviewer-core = { path = "crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Page and backend errors go to a file under app_log_dir, so a dead-on-arrival
# window still leaves something to debug from.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only. These have no mobile implementation and this app has no mobile
# target, but keeping the cfg means a stray mobile build fails at resolve time
# rather than deep inside a plugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
