# Sample MSA project for trying akbun-agent-analysiscode end to end.
# Run from this directory: uv run akbun-agent-analysiscode learn
provider = "claude"

[services.order]
path = "./order-service"
description = "takes customer orders and orchestrates payment and stock"

[services.payment]
path = "./payment-service"
description = "captures payments through an external bank gateway"

[services.inventory]
path = "./inventory-service"
description = "tracks stock levels and reservations"

[services.notification]
path = "./notification-service"
description = "sends emails when order events happen"
