<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; media-src 'self' blob:; script-src 'self'" />
  <title>akbun-shadowing-player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="home-screen">
    <header class="home-header">
      <h1>akbun-shadowing-player</h1>
      <div class="home-actions">
        <button id="add-files" class="primary">음성 파일 불러오기</button>
        <button id="add-folder">폴더 불러오기</button>
        <button id="refresh-library" title="사라진 파일을 목록에서 지운다">새로고침</button>
      </div>
    </header>
    <ul id="file-list"></ul>
    <p id="empty-hint">mp3, wav 등 음성 파일을 불러오면 목록에 나타난다. 파일을 클릭하면 재생 화면으로 이동한다.</p>
  </section>

  <section id="player-screen" hidden>
    <header class="player-header">
      <button id="go-home">← 홈</button>
      <span id="track-name"></span>
    </header>

    <div id="wave-wrap">
      <canvas id="wave"></canvas>
      <div id="wave-loading">파형을 계산하는 중…</div>
    </div>

    <div class="time-row">
      <span id="time-now">0:00</span> / <span id="time-total">0:00</span>
    </div>

    <footer class="controls">
      <div class="control-bar">
        <button id="back5" title="5초 뒤로 (←)" aria-label="5초 뒤로">⏪</button>
        <button id="play" class="play-button" title="재생/일시정지 (Space)" aria-label="재생 또는 일시정지">▶</button>
        <button id="fwd5" title="5초 앞으로 (→)" aria-label="5초 앞으로">⏩</button>

        <span class="control-divider"></span>

        <button id="loop-a" title="구간 시작 A" aria-label="구간 반복 시작 지점 지정">Ⓐ</button>
        <button id="loop-b" title="구간 끝 B" aria-label="구간 반복 끝 지점 지정">Ⓑ</button>
        <button id="loop-clear" title="구간 반복 해제" aria-label="구간 반복 해제">✕</button>

        <span class="control-divider"></span>

        <button id="speed-down" title="느리게" aria-label="재생 속도 낮추기">−</button>
        <span id="speed" aria-label="재생 속도">1.0x</span>
        <button id="speed-up" title="빠르게" aria-label="재생 속도 높이기">+</button>

        <span class="control-divider"></span>

        <button id="zoom-out" title="파형 축소" aria-label="파형 축소">🔍−</button>
        <button id="zoom-in" title="파형 확대" aria-label="파형 확대">🔍+</button>
      </div>
    </footer>
  </section>

  <section id="settings-screen" hidden>
    <header class="player-header">
      <button id="settings-close">← 닫기</button>
      <span class="header-title">Settings</span>
    </header>

    <div class="settings-body">
      <h2>테마</h2>
      <p class="settings-desc">기본은 시스템 설정을 따라간다.</p>
      <select id="theme-select">
        <option value="system">시스템</option>
        <option value="light">라이트</option>
        <option value="dark">다크</option>
      </select>

      <h2>저장 위치</h2>
      <p class="settings-desc">기본 위치이며 앱에서 바꾸지 않는다.</p>
      <dl class="path-list">
        <dt>메타데이터(파일 목록)</dt>
        <dd><code id="library-path"></code> <button class="reveal" data-target="library">폴더 열기</button></dd>
        <dt>로그 파일</dt>
        <dd><code id="log-path"></code> <button class="reveal" data-target="log">폴더 열기</button></dd>
      </dl>

      <h2>버전</h2>
      <p class="settings-desc"><code id="app-version"></code></p>
    </div>
  </section>

  <script src="../dist/renderer/waveform.js"></script>
  <script src="../dist/renderer/renderer.js"></script>
</body>
</html>
