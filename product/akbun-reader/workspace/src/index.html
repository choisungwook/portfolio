<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#203f55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>akbun reader · 읽기 보관함</title>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><a href="/" class="brand">akbun <strong>reader</strong></a><span>나의 읽기 보관함</span><button id="settings">설정</button></header>
  <div id="notice" role="status" aria-live="polite"></div>
  <div class="layout">
    <aside>
      <nav aria-label="보관함 위치" id="locations"></nav>
      <nav aria-label="RSS·태그·공개 링크" id="sections" class="sections"></nav>
      <label class="filter">태그로 찾기<select id="tag-filter"><option value="">모든 태그</option></select></label>
      <form id="save-form">
        <h2>읽을 글 담기</h2>
        <label>URL<input name="url" type="url" required placeholder="https://" maxlength="4000"></label>
        <label>제목 <span>(선택)</span><input name="title" maxlength="500"></label>
        <label>태그 <span>(쉼표로 구분)</span><input name="tags" maxlength="2400"></label>
        <button class="primary" type="submit">저장</button>
      </form>
      <p class="aside-note">좋은 글을 모아두고,<br>나의 속도로 읽어요.</p>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav aria-label="보관함 위치" id="location-bar" class="location-bar"></nav>
</body>
</html>
