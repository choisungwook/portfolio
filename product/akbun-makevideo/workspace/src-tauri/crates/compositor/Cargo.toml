[package]
name = "makevideo-compositor"
version = "0.1.0"
description = "The compositor the preview and the render both draw with, on the GPU or the CPU"
edition = "2021"
license = "MIT"

# Depends on the render crate only for its geometry types, and on neither tauri
# nor ffmpeg. It takes decoded RGBA in and gives one composited frame back, so
# it can be tested against a software Vulkan device, or against no graphics
# stack at all.

[features]
# wgpu is a large dependency and a machine may have nothing for it to talk to,
# so it is a choice rather than a requirement. Without it the software
# compositor is the whole crate and the build never mentions wgpu.
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
makevideo-render = { path = "../render" }
# The supply meter's report is JSON in the same shape the page harness writes,
# so the two engines can be compared file against file. serde is already in this
# tree through the render crate; only the writer is new.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.23"
fontdue = "0.9"
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }

# Headless: measures the frame source against real media with no window and no
# app binary. It is how the buffering settings are chosen and how playback
# supply is judged.
[[bin]]
name = "supply-soak"
path = "src/bin/supply_soak.rs"
