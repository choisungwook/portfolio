[package]
name = "makevideo-render"
version = "0.1.0"
description = "The project model plus the ffmpeg command the render runs"
edition = "2021"
license = "MIT"

# Deliberately depends on neither tauri nor anything that needs a webview.
# That is what lets the pull request job test this on Linux in seconds without
# installing GTK and WebKit development packages. It also shells out to nothing:
# building the argument list is pure, so the graph can be asserted on a runner
# that has no ffmpeg installed.

[dependencies]
# The project shape this crate renders. It is defined next door rather than
# here because the app edits it, and the render is one of its readers.
makevideo-edit = { path = "../edit" }
# Time is the bottom of the stack: this crate stores frame counts and hands
# seconds to ffmpeg, and both go through that one place.
makevideo-time = { path = "../time" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
