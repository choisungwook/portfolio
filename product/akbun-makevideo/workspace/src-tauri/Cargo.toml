[workspace]
members = [
  "crates/time",
  "crates/edit",
  "crates/render",
  "crates/compositor",
  "crates/audio",
  "crates/present",
  "crates/proxy",
  "crates/waveform",
]

[package]
name = "akbun-makevideo"
version = "0.1.0"
description = "Desktop video editor: multi track timeline, live preview, ffmpeg render"
authors = ["akbun"]
license = "MIT"
edition = "2021"

# The version that ships is the one in ../package.json, which tauri.conf.json
# points at. The number here is not read by the bundler and is only present
# because cargo requires it.

[lib]
# The _lib suffix keeps the library name from colliding with the binary name,
# which is only a problem on Windows. See rust-lang/cargo#8519.
name = "akbun_makevideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The editing model. The app owns one Document made of these types and every
# change to the project goes through a command on it, so this crate is where
# the timeline actually lives.
makevideo-edit = { path = "crates/edit" }
# The ffmpeg command builder lives in its own crate so the pull request job can
# test it without compiling tauri, which would mean installing GTK and WebKit
# on the runner.
makevideo-render = { path = "crates/render" }
# The GPU compositor the preview frame and the render both draw with. Pulls in
# wgpu, which is why it is a separate crate: the pull request job tests the
# model without it.
makevideo-compositor = { path = "crates/compositor" }
# The playback scheduler and the surface the monitor draws on. Everything about
# *when* a frame is shown lives there and is measured headless; what is left
# here is a thread and a native view.
makevideo-present = { path = "crates/present" }
# The mix, the clock the picture follows, and the output device. The device half
# is only used here, which is why this is a direct dependency rather than
# something reached through the present crate.
makevideo-audio = { path = "crates/audio" }
makevideo-proxy = { path = "crates/proxy" }
makevideo-waveform = { path = "crates/waveform" }
# protocol-asset is what makes asset_protocol_scope() exist. Without the
# feature the preview shows broken media with no error anywhere.
tauri = { version = "2", features = ["protocol-asset"] }
# The swapchain the monitor draws on is made from the compositor's own device,
# so the app names the same wgpu the compositor does.
wgpu = "30"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Project deletion is recoverable. The whole managed project directory goes to
# Trash so its generated proxies cannot be left behind.
trash = "5"

# Desktop only. These have no mobile implementation and this app has no mobile
# target, but keeping the cfg means a stray mobile build fails at resolve time
# rather than deep inside a plugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# The viewport is a native view under the webview, and making one is AppKit.
# Only this file's worth of the app is platform specific; see src/viewport/.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSGraphics", "NSResponder"] }
objc2-foundation = "0.3"
raw-window-handle = "0.6"
