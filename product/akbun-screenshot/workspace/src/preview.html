<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>akbun-screenshot Preview</title>
  <style>
    html { background: transparent; }

    body {
      margin: 0;
      height: 100vh;
      background: transparent;
      font-family: -apple-system, sans-serif;
    }

    .card {
      position: relative;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(30, 30, 30, 0.85);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* A 2x2 grid rather than one row. Four buttons across a 280px card left
       each one barely wider than its label, and the row had to be aimed at.
       The grid is centred as a block, so the buttons stay together instead of
       spreading to the card's edges. */
    .actions {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(2, 88px);
      align-content: center;
      justify-content: center;
      gap: 8px;
      opacity: 0;
      background: rgba(0, 0, 0, 0.45);
      transition: opacity 0.15s;
    }

    .card:hover .actions { opacity: 1; }

    button {
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    #save { background: #2e7d32; }
    #copy { background: #1565c0; }
    #edit { background: #6a1b9a; }
    #close { background: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <img id="shot" alt="screenshot">
    <!-- The overlay covers the card, so it is the drag handle. Tauri drags
         only the element carrying the attribute, so the buttons still click. -->
    <div class="actions" data-tauri-drag-region>
      <button id="save">Save</button>
      <button id="copy">Copy</button>
      <button id="edit">Edit</button>
      <button id="close">Close</button>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="preview.js"></script>
</body>
</html>
