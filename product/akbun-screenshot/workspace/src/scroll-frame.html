<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>akbun-screenshot Scrolling Capture Frame</title>
  <style>
    /* The window is the region plus a 3px gap on each side, so the dashed line
       sits outside what gets captured. */
    html, body { margin: 0; height: 100%; background: transparent; }
    body { box-sizing: border-box; border: 2px dashed #ff3b30; }
  </style>
</head>
<body></body>
</html>
