<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self' 'unsafe-inline'">
  <title>akbun-screenshot Preview</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: transparent;
      font-family: -apple-system, sans-serif;
      -webkit-app-region: drag;
    }

    .card {
      position: relative;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(30, 30, 30, 0.85);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .actions {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      background: rgba(0, 0, 0, 0.45);
      transition: opacity 0.15s;
    }

    .card:hover .actions { opacity: 1; }

    button {
      -webkit-app-region: no-drag;
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    #save { background: #2e7d32; }
    #delete { background: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <img id="shot" alt="screenshot">
    <div class="actions">
      <button id="save">Save</button>
      <button id="delete">Delete</button>
    </div>
  </div>

  <script src="preview.js"></script>
</body>
</html>
