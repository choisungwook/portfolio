[package]
name = "screenshot-core"
version = "0.1.0"
description = "Pure helpers for akbun-screenshot: capture modes, filenames, settings merge, window geometry, png checks, scrolling capture stitching"
edition = "2021"
license = "MIT"

# Deliberately depends on neither tauri nor anything that needs a webview, so
# the pull request job tests this on Linux in seconds without GTK and WebKit.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The editor hands its canvas over as a png data URL.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# Decodes scrolling capture frames to compare their rows. Already in the
# app's tree through tauri, so it adds nothing to the build.
png = "0.18"
