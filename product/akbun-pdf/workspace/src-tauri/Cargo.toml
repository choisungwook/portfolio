[package]
name = "akbun-pdf"
version = "0.1.0"
description = "Offline desktop PDF reader and editor"
authors = ["akbun"]
license = "MIT"
edition = "2021"

[workspace]
members = ["crates/pdf-ai", "crates/pdf-core"]
resolver = "2"

[lib]
name = "akbun_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pdf-ai = { path = "crates/pdf-ai" }
pdf-core = { path = "crates/pdf-core" }
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
