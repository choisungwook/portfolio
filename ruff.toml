# .claude/rule-details/python.md의 규칙 중 기계가 판정할 수 있는 것.
# verify-pull-request.yml이 PR에서 바뀐 .py 파일에만 적용한다.
indent-width = 2
line-length = 160

[lint]
select = [
  "E", "F",  # 문법 오류와 미사용 이름
  "N",       # snake_case 함수와 변수, PascalCase 클래스, UPPER_SNAKE_CASE 상수
  "ANN001", "ANN201", "ANN202",  # 인자와 반환값 타입 힌트
  "D100", "D101", "D102", "D103",  # 모듈, 클래스, 함수 docstring
  "C901",    # 함수 하나가 여러 일을 하면 분기가 늘어난다
]

[lint.mccabe]
max-complexity = 10

[format]
indent-style = "space"
