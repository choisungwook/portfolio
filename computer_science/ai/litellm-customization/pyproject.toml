[project]
name = "litellm-customization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm[proxy]==1.109.1",
    "prisma>=0.11,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:warnings"
