# 9단계(Router 폴백): provider 코드는 Router.asearch를 한 번 부르고, 실패하면 router_settings.fallbacks가 넘긴다.
model_list:
  - model_name: chat-small
    litellm_params:
      model: openai/mock-small
      mock_response: "검색 결과를 바탕으로 한 small 모델의 답변입니다."
  - model_name: gateway-search
    litellm_params:
      model: gateway/search

search_tools:
  - search_tool_name: searxng-primary
    litellm_params:
      search_provider: searxng
      api_base: http://localhost:8899     # 아무것도 떠 있지 않다. 1순위 장애를 흉내 낸다
  - search_tool_name: searxng-backup
    litellm_params:
      search_provider: searxng
      api_base: http://localhost:8890     # scripts/mock_searxng.py

router_settings:
  fallbacks:
    - searxng-primary: ["searxng-backup"]   # 검색 도구도 model group처럼 이름으로 fallback을 건다

litellm_settings:
  custom_provider_map:
    - provider: gateway
      custom_handler: gateway.search_provider.gateway_search_router_fallback
  callbacks: ["gateway.feature_switch.feature_switch_to_search"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
