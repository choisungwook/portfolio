# 6단계: 분류 모델이 시간 제한(0.5초)보다 느릴 때 규칙 판정으로 넘어가는지 확인한다.
model_list:
  - model_name: chat-small
    litellm_params:
      model: openai/mock-small
      mock_response: "small 모델의 mock 응답입니다."
  - model_name: chat-large
    litellm_params:
      model: openai/mock-large
      mock_response: "large 모델의 mock 응답입니다."
  - model_name: intent-classifier           # 분류 전용 작은 모델
    litellm_params:
      model: openai/mock-classifier
      mock_response: '{"intent": "heavy"}'  # 항상 heavy라고 답하는 mock
      mock_delay: 2                         # 시간 제한 0.5초보다 느리다

litellm_settings:
  callbacks: ["gateway.intent_router.intent_router_memory"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
