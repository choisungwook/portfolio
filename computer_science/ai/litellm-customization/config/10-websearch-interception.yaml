# 10단계: LiteLLM 내장 websearch_interception. 모델이 검색 tool 호출을 결정하면 LiteLLM이 검색을 실행하고 다시 모델을 부른다.
model_list:
  - model_name: chat-tool
    litellm_params:
      model: fakemodel/tool        # gateway/fake_tool_model.py. 모델 주도 tool 호출을 흉내 낸다

search_tools:
  - search_tool_name: searxng-backup
    litellm_params:
      search_provider: searxng
      api_base: http://localhost:8890     # scripts/mock_searxng.py

litellm_settings:
  custom_provider_map:
    - provider: fakemodel
      custom_handler: gateway.fake_tool_model.fake_tool_model
  callbacks: ["websearch_interception"]
  websearch_interception_params:
    enabled_providers: ["fakemodel"]
    search_tool_name: searxng-backup

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
