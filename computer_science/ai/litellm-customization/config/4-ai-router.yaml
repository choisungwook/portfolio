# 4단계: 로컬 gemma2:2b(CPU 전용)가 질문을 보고 claude/gemini 중 하나를 고르는 훅.
model_list:
  - model_name: claude
    litellm_params:
      model: openai/mock-claude
      mock_response: "claude 별칭의 mock 응답입니다."
  - model_name: gemini
    litellm_params:
      model: openai/mock-gemini
      mock_response: "gemini 별칭의 mock 응답입니다."
  - model_name: router-judge            # 판정 전용 소형 모델. 실제로 로컬 Ollama를 호출한다
    litellm_params:
      model: ollama_chat/gemma2:2b
      api_base: http://localhost:11434
      num_gpu: 0                        # GPU에 올릴 layer 수. 0이면 CPU로만 추론한다
      temperature: 0

litellm_settings:
  callbacks: ["gateway.ai_router.ai_router"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
