# 5단계(locked): 훅 두 개의 실행 순서 비교.
model_list:
  - model_name: chat-small
    litellm_params:
      model: openai/mock-small
      mock_response: "small 모델의 mock 응답입니다."
  - model_name: chat-large
    litellm_params:
      model: openai/mock-large
      mock_response: "large 모델의 mock 응답입니다."

litellm_settings:
  callbacks: ["gateway.routing_order.upgrade_hook_locking", "gateway.routing_order.downgrade_hook_locking"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
