[project]
name = "study-llmserving-ch5-6"
version = "0.1.0"
description = "Chapter 5 and 6 NVIDIA GPU hands-on for LLM serving optimization"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]
client = [
  "httpx>=0.28",
]
viz = [
  "matplotlib>=3.10",
]
[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
