[project]
name = "study-llmserving-ch5-6"
version = "0.1.0"
description = "Chapter 5 and 6 hands-on for LLM serving optimization"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]
client = [
  "httpx>=0.28",
]
dynamic = [
  "fastapi>=0.116",
  "prometheus-client>=0.22",
  "torch>=2.8",
  "transformers>=4.55",
  "uvicorn>=0.35",
]
mac = [
  "mlx-lm>=0.31,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
