name: llm-serving-ch5-6

x-runtime: &runtime
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: llm-serving-lab:v0.27.1-cu129
  volumes:
    - .:/workspace
    - hf-cache:/root/.cache/huggingface

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-vllm: &vllm
  <<: [*runtime, *gpu]
  ipc: host
  ports:
    - "${LAN_BIND_ADDRESS:-0.0.0.0}:8000:8000"
  networks:
    default:
      aliases:
        - model-server

services:
  model-loader:
    <<: [*runtime, *gpu]
    profiles: [tools]
    command: ["python3", "-m", "model_loader.load_3b"]

  gpu-probe:
    <<: [*runtime, *gpu]
    profiles: [tools]
    command: ["python3", "-m", "benchmark.roofline_probe"]

  benchmark:
    <<: *runtime
    profiles: [tools]
    environment:
      MODEL_BASE_URL: http://model-server:8000
      PROMETHEUS_URL: http://prometheus:9090
      SERVED_MODEL_NAME: qwen
    command: ["python3", "-m", "benchmark.summary"]

  vllm-bf16:
    <<: *vllm
    profiles: [bf16]
    command:
      - vllm
      - serve
      - Qwen/Qwen2.5-3B-Instruct
      - --served-model-name
      - qwen
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-4096}"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"

  vllm-gptq:
    <<: *vllm
    profiles: [gptq]
    command:
      - vllm
      - serve
      - Qwen/Qwen2.5-3B-Instruct-GPTQ-Int4
      - --served-model-name
      - qwen
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-4096}"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"

  vllm-fp8:
    <<: *vllm
    profiles: [fp8]
    command:
      - vllm
      - serve
      - RedHatAI/Qwen2.5-3B-Instruct-FP8-dynamic
      - --served-model-name
      - qwen
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-4096}"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${LAN_BIND_ADDRESS:-0.0.0.0}:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${LAN_BIND_ADDRESS:-0.0.0.0}:3000:3000"

  dcgm-exporter:
    image: nvidia/dcgm-exporter:4.8.3
    profiles: [observability]
    <<: *gpu
    cap_add:
      - SYS_ADMIN
    ports:
      - "${LAN_BIND_ADDRESS:-0.0.0.0}:9400:9400"

volumes:
  hf-cache:
  prometheus-data:
  grafana-data:
