global
  log stdout format raw local0 info
  ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 30s
  timeout server 30s

#####################################################################
# 1) TCP passthrough: route by the SNI inside the ClientHello.
#    HAProxy never holds a private key here.
#####################################################################
frontend fe_sni_passthrough
  bind *:8443
  mode tcp
  # req.ssl_sni only lives as long as the request buffer, so copy it into a
  # session variable that is still readable when the log line is emitted.
  log-format "%ci:%cp sni=%[var(sess.sni)] backend=%b server=%s bytes=%B"

  # Wait for the ClientHello before the routing rules run.
  tcp-request inspect-delay 5s
  tcp-request content set-var(sess.sni) req.ssl_sni
  tcp-request content accept if { req.ssl_hello_type 1 }
  # Reached only when no ClientHello arrived within the inspect-delay.
  tcp-request content reject

  use_backend be_a_tls if { req.ssl_sni -i a.lab.local }
  use_backend be_b_tls if { req.ssl_sni -i b.lab.local }

  # The handshake carried no SNI at all: an IP literal client, or a client
  # that does not send the extension. Split from "unknown name" on purpose.
  use_backend be_nosni_tls if !{ req.ssl_sni -m found }

  # SNI present but not in the routing table.
  default_backend be_unknown_tls

backend be_a_tls
  mode tcp
  server a nginx-a:443

backend be_b_tls
  mode tcp
  server b nginx-b:443

backend be_nosni_tls
  mode tcp
  server fallback nginx-default:443

backend be_unknown_tls
  mode tcp
  server fallback nginx-default:443

#####################################################################
# 2) TLS termination: HAProxy owns the certificates, so a client that
#    sends no SNI still gets the default certificate and is then routed
#    by the HTTP Host header.
#####################################################################
frontend fe_tls_terminate
  bind *:8444 ssl crt-list /usr/local/etc/haproxy/crt-list.txt alpn h2,http/1.1
  mode http
  log-format "%ci:%cp sni=%[ssl_fc_sni] has_sni=%[ssl_fc_has_sni] host=%[req.hdr(host)] backend=%b status=%ST"

  # Visible in the response body of the backend, useful while experimenting.
  http-request set-header X-Sni %[ssl_fc_sni]
  http-request set-header X-Has-Sni %[ssl_fc_has_sni]

  # Host carries the port, so compare only the part before ":".
  acl host_a req.hdr(host),field(1,:) -i a.lab.local
  acl host_b req.hdr(host),field(1,:) -i b.lab.local

  use_backend be_a_http if host_a
  use_backend be_b_http if host_b
  default_backend be_default_http

backend be_a_http
  mode http
  server a nginx-a:80

backend be_b_http
  mode http
  server b nginx-b:80

backend be_default_http
  mode http
  server fallback nginx-default:80

frontend fe_stats
  bind *:8404
  mode http
  stats enable
  stats uri /
  stats refresh 5s
