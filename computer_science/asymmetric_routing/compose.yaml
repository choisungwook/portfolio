name: asymmetric-routing

# client --- edge(10.10.0.0/24) --- r1 --- net_a(10.20.0.0/24) --- server
#                                \-- r2 --- net_b(10.30.0.0/24) --/
#
# The forward path is fixed to r1 by the client route.
# The return path is chosen by the server route, so it can be flipped to r2.

x-node: &node
  image: nicolaka/netshoot:latest
  privileged: true
  init: true
  volumes:
    - ./scripts:/scripts:ro

services:
  client:
    <<: *node
    container_name: ar-client
    hostname: client
    command: ["/scripts/client.sh"]
    networks:
      edge:
        ipv4_address: 10.10.0.10

  r1:
    <<: *node
    container_name: ar-r1
    hostname: r1
    command: ["/scripts/router.sh"]
    networks:
      edge:
        ipv4_address: 10.10.0.2
      net_a:
        ipv4_address: 10.20.0.2

  r2:
    <<: *node
    container_name: ar-r2
    hostname: r2
    command: ["/scripts/router.sh"]
    networks:
      edge:
        ipv4_address: 10.10.0.3
      net_b:
        ipv4_address: 10.30.0.3

  server:
    <<: *node
    container_name: ar-server
    hostname: server
    command: ["/scripts/server.sh"]
    networks:
      net_a:
        ipv4_address: 10.20.0.10
      net_b:
        ipv4_address: 10.30.0.20

networks:
  edge:
    ipam:
      config:
        - subnet: 10.10.0.0/24
  net_a:
    ipam:
      config:
        - subnet: 10.20.0.0/24
  net_b:
    ipam:
      config:
        - subnet: 10.30.0.0/24
