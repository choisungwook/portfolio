# Kubeflow 밖의 구성요소를 이 저장소의 디렉터리에서 만든다. MLflow와 NVIDIA device plugin은 kustomize helmCharts로 Helm chart를 쓴다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mlops-part2-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-part2
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - name: nvidia-device-plugin
        namespace: nvidia-device-plugin
      - name: mlflow
        namespace: mlflow
      - name: redis
        namespace: redis
      # 사용자 namespace(kubeflow-user-example-com)는 profile controller가 만든다. 그 전에는 재시도한다.
      - name: kubeflow-user-resources
        namespace: kubeflow-user-example-com
        path: kubeflow/user-resources
  template:
    metadata:
      name: '{{ .name }}'
      labels:
        app.kubernetes.io/part-of: mlops-part2
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/choisungwook/portfolio.git
        # 검증 중 임시값. merge 전 master로 되돌린다.
        targetRevision: feat/ml-platform-part2-lab0
        path: 'mlops/ml-platform-engineering-part2/manifests/{{ if hasKey . "path" }}{{ .path }}{{ else }}{{ .name }}{{ end }}'
      # Helm chart가 만드는 리소스는 namespace가 비어 있다. Argo CD가 이 값으로 채운다.
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        # Istio, KFP, KServe, Argo CD CRD가 커서 client-side apply의 annotation 크기 제한(262KB)을 넘는다.
        - ServerSideApply=true
        # 같은 sync 안에서 만들 CRD를 쓰는 리소스가 dry-run에서 실패하지 않게 한다.
        - SkipDryRunOnMissingResource=true
        # ApplicationSet은 Application 사이의 순서를 보장하지 않는다.
        # cert-manager, Istio, profile controller가 먼저 떠야 하는 Application은 재시도로 순서를 맞춘다.
        retry:
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
