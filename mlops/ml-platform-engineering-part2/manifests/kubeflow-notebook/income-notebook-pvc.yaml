# Kubeflow Notebook UI가 노트북을 만들 때 자동으로 만드는 workspace PVC와 같은 것이다.
# Argo CD가 관리하지 않는다. kubectl로 노트북을 만드는 시나리오에서 직접 적용한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: income-notebook-workspace
  namespace: kubeflow-user-example-com
  labels:
    app: income-notebook
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
