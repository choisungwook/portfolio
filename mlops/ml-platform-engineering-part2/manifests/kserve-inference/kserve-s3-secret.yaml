# KServe storage initializer가 object storage에서 모델을 내려받을 때 쓰는 계정과 S3 주소다.
# 계정은 Secret mlflow-access와 같은 KFP 기본값이다. mlflow-access는 Argo CD가 관리해서 annotation을 더하지 않고 따로 둔다.
apiVersion: v1
kind: Secret
metadata:
  name: kserve-s3
  namespace: kubeflow-user-example-com
  labels:
    app.kubernetes.io/part-of: mlops-part2
  annotations:
    serving.kserve.io/s3-endpoint: seaweedfs.kubeflow.svc.cluster.local:8333
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio123
