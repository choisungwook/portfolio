# KServe storage initializer가 object storage에서 모델을 내려받을 때 쓰는 ServiceAccount다.
# Secret kserve-s3의 계정과 serving.kserve.io/* annotation(S3 주소)을 쓴다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-s3
  namespace: kubeflow-user-example-com
  labels:
    app.kubernetes.io/part-of: mlops-part2
secrets:
- name: kserve-s3
